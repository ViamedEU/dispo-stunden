  <style>
    /* Stunden-Übersicht für die Dispo (Viamed Euskirchen). Daten nur mit Dispo-PIN vom Backend. */
    :root { --tinte: #14231a; --text: #2c3a31; --leise: #6b7a70; --feld: #f4f7f5; --flaeche: #eef5f0; --linie: #e8efea;
            --gruen: #2e9a3e; --gruen-2: #7cc242; --gruen-hell: #e9f7e6; --blau: #0284c7; --blau-hell: #e6f5fd; --rose: #e11d48; --rose-hell: #ffeef2;
            --gelb: #b45309; --gelb-hell: #fff4dc; --schatten: 0 8px 28px rgba(20, 50, 30, 0.08); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); background: radial-gradient(1200px 500px at 50% -200px, #d9f0d9 0%, transparent 70%), var(--flaeche); min-height: 100vh; }
    .wrap { max-width: 1480px; margin: 0 auto; padding: 1rem 1.25rem; }
    button { font: inherit; }

    /* PIN */
    .pin-seite { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
    .pin-karte { width: 100%; max-width: 380px; background: #fff; border-radius: 28px; box-shadow: 0 24px 60px rgba(20,50,30,0.15); overflow: hidden; text-align: center; }
    .pin-kopf { color: #fff; padding: 1.6rem 1.4rem 2.6rem; background: linear-gradient(135deg, #0f6b4f 0%, #2e8b3a 45%, #6fb83a 100%); }
    .pin-kopf .logo { margin: 0 auto 0.8rem; }
    .pin-kopf h1 { font-size: 1.4rem; font-weight: 800; }
    .pin-kopf p { font-size: 0.88rem; opacity: 0.92; margin-top: 0.2rem; }
    .pin-form { padding: 0 1.4rem 1.5rem; margin-top: -1.6rem; }
    .pin-form input { width: 100%; height: 60px; border-radius: 16px; border: 2px solid transparent; background: #fff; box-shadow: 0 8px 22px rgba(0,0,0,0.12); text-align: center; font-size: 1.6rem; letter-spacing: 0.4em; font-weight: 800; color: var(--tinte); }
    .pin-form input:focus { outline: none; border-color: var(--gruen); }
    .pin-form input::placeholder { letter-spacing: 0.08em; font-size: 1.05rem; font-weight: 600; color: #a3b1a8; }
    .knopf { width: 100%; height: 56px; margin-top: 0.9rem; border: none; border-radius: 16px; color: #fff; font-weight: 800; font-size: 1.05rem; cursor: pointer; background: linear-gradient(135deg, var(--gruen), var(--gruen-2)); box-shadow: 0 10px 22px rgba(0,0,0,0.14); }
    .knopf:disabled { opacity: 0.65; cursor: wait; }
    .fehler { margin-top: 0.8rem; color: var(--rose); font-size: 0.88rem; font-weight: 600; min-height: 1.2em; }

    /* Kopf */
    .hero { position: relative; overflow: hidden; color: #fff; border-radius: 26px; padding: 1.2rem 1.3rem 1.3rem; background: linear-gradient(135deg, #0f6b4f 0%, #2e8b3a 45%, #6fb83a 100%); }
    .hero::before { content: ""; position: absolute; width: 300px; height: 300px; right: -90px; top: -150px; border-radius: 50%; background: rgba(255,255,255,0.1); pointer-events: none; }
    .kopf { position: relative; display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; }
    .logo { width: 50px; height: 50px; border-radius: 15px; background: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 6px 18px rgba(0,0,0,0.15); }
    .logo img { width: 36px; height: 36px; }
    .kopf h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; }
    .kopf p { font-size: 0.85rem; opacity: 0.9; }
    .rechts-oben { margin-left: auto; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .monat { display: flex; align-items: center; gap: 0.3rem; background: rgba(255,255,255,0.18); border-radius: 999px; padding: 0.25rem; }
    .monat button { width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255,255,255,0.22); color: #fff; font-size: 1.1rem; cursor: pointer; }
    .monat button:disabled { opacity: 0.35; cursor: default; }
    .monat strong { min-width: 128px; text-align: center; font-size: 0.95rem; }
    .abmelden { border: none; background: rgba(255,255,255,0.18); color: #fff; border-radius: 999px; padding: 0.55rem 0.9rem; font-weight: 700; font-size: 0.82rem; cursor: pointer; }
    .kacheln { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.6rem; margin-top: 1.1rem; }
    .kachel { background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.22); border-radius: 18px; padding: 0.75rem 0.85rem; }
    .kachel small { display: block; font-size: 0.72rem; font-weight: 700; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.04em; }
    .kachel strong { font-size: 1.45rem; font-weight: 800; }
    .kachel span { font-size: 0.8rem; opacity: 0.9; }

  <script>
    "use strict";
    const API_URL = "https://script.google.com/macros/s/AKfycbzlUcw-sJFQLJouP44M_oC2Ko2ZKXv-DuR1VkHTZQKo-lUsB0Hk42fgJcP1v2NHolpd1Q/exec";
    // Demo (erfundene Daten): mit ?demo oder wenn die Seite lokal geöffnet wird
    const DEMO = /[?&]demo\b/.test(location.search) || !/^https?:$/.test(location.protocol) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    const $ = (id) => document.getElementById(id);
    const FARBEN = ["#2e9a3e", "#0284c7", "#e11d48", "#7c3aed", "#ea580c", "#0d9488", "#ca8a04", "#db2777"];

    // ---------- Helfer ----------
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
    function norm(s) { return String(s || "").toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().replace(/\s+/g, " "); }
    function normKz(s) { return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
    function isoVon(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
    function alsDatum(iso) { const t = iso.split("-"); return new Date(+t[0], +t[1] - 1, +t[2], 12); }
    function kurz(iso) { return alsDatum(iso).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" }); }
    function std(x) { return (Math.round(x * 100) / 100).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function minuten(hhmm) { const t = String(hhmm || "").split(":"); return +t[0] * 60 + +t[1]; }
    // Feiertage NRW (wie im Backend): zählen nicht als Werktag / Urlaubstag
    const feiertagCache = {};
    function feiertageNRW(j) {
      const a = j % 19, b = Math.floor(j / 100), c = j % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
      const ostern = new Date(j, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1, 12);
      const o = (n) => isoVon(new Date(ostern.getTime() + n * 86400000));
      return { [j + "-01-01"]: "Neujahr", [o(-2)]: "Karfreitag", [o(1)]: "Ostermontag", [j + "-05-01"]: "Tag der Arbeit", [o(39)]: "Christi Himmelfahrt", [o(50)]: "Pfingstmontag",
               [o(60)]: "Fronleichnam", [j + "-10-03"]: "Tag der Deutschen Einheit", [j + "-11-01"]: "Allerheiligen", [j + "-12-25"]: "1. Weihnachtstag", [j + "-12-26"]: "2. Weihnachtstag" };
    }
    function feiertag(iso) { const j = +iso.slice(0, 4); return (feiertagCache[j] = feiertagCache[j] || feiertageNRW(j))[iso] || ""; }
    function werktag(iso) { const t = alsDatum(iso).getDay(); return t !== 0 && t !== 6 && !feiertag(iso); }
    function kw(iso) { const d = alsDatum(iso), t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())), w = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - w); return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7); }
    function kurzName(n) { const t = String(n).split(" ").filter(Boolean); return t.length > 1 ? t[0][0] + ". " + t[t.length - 1] : n; }
    const WARN_AB = 3;   // ab so vielen Abwesenden an einem Tag: Warnung
    function tageZwischen(von, bis) { const out = []; const d = alsDatum(von), e = alsDatum(bis); while (d <= e) { out.push(isoVon(d)); d.setDate(d.getDate() + 1); } return out; }
    function initialen(n) { const t = n.split(" ").filter(Boolean); return ((t[0] || "?")[0] + (t.length > 1 ? t[t.length - 1][0] : "")).toUpperCase(); }
    function farbe(n) { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0; return FARBEN[h % FARBEN.length]; }
    function monatText(m) { const t = m.split("-"); return new Date(+t[0], +t[1] - 1, 1).toLocaleDateString("de-DE", { month: "long", year: "numeric" }); }
    function monatName(m) { return monatText(m).split(" ")[0]; }
    // Uhrzeit ändern, Durchschnitt und Stundenkonto gibt es erst ab Backend 2.5 (ältere Versionen speichern unbekannte Aktionen als Arbeitszeit)
    function backendAb(soll) { if (DEMO) return true; const v = String((daten && daten.version) || "0.0").split(".").map(Number), s = soll.split(".").map(Number); return v[0] > s[0] || (v[0] === s[0] && v[1] >= s[1]); }
    function backendNeu() { return backendAb("2.5"); }
    // ab 2.6: Stunden je Urlaubs-/Krankheitstag, Einträge nachtragen
    function monatPlus(m, n) { const t = m.split("-"); const d = new Date(+t[0], +t[1] - 1 + n, 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
    function speicherS(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

    // ---------- Backend ----------
    function apiPost(body) {
      if (DEMO) return Demo.post(body);
      return Promise.race([fetch(API_URL, { method: "POST", body: JSON.stringify(body) }).then((r) => r.json()),
                           new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 45000))]);
    }

    // ---------- Zustand ----------
    let daten = null, monat = isoVon(new Date()).slice(0, 7), ansicht = "monat", suche = "", gewaehlt = null;
    let personen = [], hinweise = [];

    async function lade(pin) {
      $("laden").hidden = false;
      let r;
      try { r = await apiPost({ aktion: "uebersicht", pin: pin, monat: monat }); }
      catch (e) { $("laden").hidden = true; return { status: "error", message: "Keine Verbindung." }; }
      $("laden").hidden = true;
      if (r.status === "ok") { daten = r; auswerten(); zeichne(); }
      return r;
    }

    // ---------- Auswertung ----------
    function auswerten() {
      const anfang = monat + "-01", ende = isoVon(new Date(+monat.slice(0, 4), +monat.slice(5, 7), 0));
      const liste = new Map(daten.mitarbeiter.map((m) => [norm(m.name), { name: m.name, inListe: true, tage: {}, summe: 0, flags: 0 }]));
      const fzg = new Set(daten.fahrzeuge.map(normKz));
      hinweise = [];
      const bekannt = new Set((daten.mitarbeiterAlle || daten.mitarbeiter).map((m) => norm(m.name)));   // auch Ausgeschiedene sind kein Tippfehler
      const person = (name) => { const k = norm(name); if (!liste.has(k)) liste.set(k, { name: name, inListe: bekannt.has(k), tage: {}, summe: 0, flags: 0 }); return liste.get(k); };
      const tagEintrag = (p, iso) => (p.tage[iso] = p.tage[iso] || []);
      const gesehen = new Set(), doppelte = {}, doppelteAbw = {};
      // Urlaub/Krank mit gleichem Zeitraum mehrfach im Sheet: zählt nur einmal (die Meldung mit Stunden, sonst die erste)
      const abwSchluessel = (e) => norm(e.name) + "|" + e.art + "|" + e.von + "|" + e.bis, abwZaehlt = new Map();
      daten.eintraege.forEach((e) => { if (e.art === "arbeit") return; const a = abwZaehlt.get(abwSchluessel(e)); if (!a || (a.stundenOffen && !e.stundenOffen)) abwZaehlt.set(abwSchluessel(e), e); });
      daten.eintraege.forEach((e) => {
        const p = person(e.name);
        if (e.art === "arbeit") {
          const schluessel = norm(e.name) + "|" + e.datum + "|" + e.beginn + "|" + e.ende;
          const x = { art: "arbeit", beginn: e.beginn, ende: e.ende, fahrzeug: e.fahrzeug, netto: e.netto, notiz: e.notiz, flags: [],
                      zeile: e.zeile, name: e.name, datum: e.datum, nettoGemeldet: e.nettoGemeldet != null ? e.nettoGemeldet : e.netto, leerzeit: e.leerzeit || 0, korrektur: e.korrektur || null, fahrzeugAlt: e.fahrzeugAlt || null, zeitAlt: e.zeitAlt || null };
          // Doppelt = gleiche Person, gleicher Tag, genau gleiche Zeit. Mehrere Fahrten nacheinander am selben Tag sind normal.
          if (gesehen.has(schluessel)) { x.doppelt = true; x.flags.push("doppelt"); const g = norm(e.name) + "|" + e.datum; (doppelte[g] = doppelte[g] || { p, datum: e.datum, zeiten: [] }).zeiten.push(e.beginn + "–" + e.ende); }
          else { gesehen.add(schluessel); p.summe += e.netto; }
          if (e.fahrzeug && !fzg.has(normKz(e.fahrzeug)) && !x.doppelt) { x.flags.push("fahrzeug"); hinweise.push({ p, datum: e.datum, typ: "fahrzeug", detail: normKz(e.fahrzeug), text: "<b>" + esc(p.name) + "</b> – " + kurz(e.datum) + ": Fahrzeug „" + esc(e.fahrzeug) + "“ steht nicht in der Fuhrpark-Liste." }); }
          tagEintrag(p, e.datum).push(x);
        } else {
          const k = abwSchluessel(e), doppelt = abwZaehlt.get(k) !== e;
          const alle = tageZwischen(e.von, e.bis).filter(werktag);
          const proTag = alle.length ? e.netto / alle.length : 0;
          // eigene Stunden je Tag (Reiter "Abwesenheit Tage"), sonst gleichmäßig verteilt
          alle.filter((t) => t >= anfang && t <= ende).forEach((t) => {
            const wert = e.tage && e.tage[t] != null ? e.tage[t] : proTag;
            tagEintrag(p, t).push({ art: e.art, netto: wert, notiz: e.notiz, flags: doppelt ? ["doppelt"] : [], doppelt: doppelt, quelle: e, tag: t, eigen: !!(e.tage && e.tage[t] != null), stundenOffen: !doppelt && !!e.stundenOffen });
            if (!doppelt) p.summe += wert;
          });
          if (doppelt) { (doppelteAbw[k] = doppelteAbw[k] || { p, e, n: 1 }).n++; return; }
          if (e.stundenOffen) hinweise.push({ p, datum: e.von, typ: "urlaub", text: "<b>" + esc(p.name) + "</b> – Urlaub " + kurz(e.von) + " – " + kurz(e.bis) + ": Stunden fehlen noch (beim Mitarbeiter auf „Stunden eintragen“)." });
        }
      });
      // Doppelt abgeschickt: ein Hinweis pro Person und Tag
      Object.values(doppelte).forEach((d) => hinweise.push({ p: d.p, datum: d.datum, typ: "doppelt", text: "<b>" + esc(d.p.name) + "</b> – " + kurz(d.datum) + ": " +
        (d.zeiten.length === 1 ? esc(d.zeiten[0]) + " steht mit genau gleicher Zeit zweimal drin. Zählt nur einmal."
                               : d.zeiten.length + " Einträge stehen mit genau gleicher Zeit doppelt drin (" + esc(d.zeiten.join(", ")) + "). Zählen nur einmal.") }));
      Object.values(doppelteAbw).forEach((d) => hinweise.push({ p: d.p, datum: d.e.von, typ: "doppelt", detail: d.e.art + " " + d.e.von + "-" + d.e.bis, text: "<b>" + esc(d.p.name) + "</b> – " +
        (d.e.art === "urlaub" ? "Urlaub " : "Krank ") + kurz(d.e.von) + " – " + kurz(d.e.bis) + " steht " + (d.n === 2 ? "zweimal" : d.n + "-mal") + " drin. Zählt nur einmal." }));
      // Überschneidungen am selben Tag (Fahrten direkt nacheinander, z. B. bis 12:35 und ab 12:35, sind keine)
      liste.forEach((p) => Object.keys(p.tage).forEach((t) => {
        const a = p.tage[t].filter((x) => x.art === "arbeit" && !x.doppelt);
        for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) {
          if (minuten(a[i].beginn) < minuten(a[j].ende) && minuten(a[j].beginn) < minuten(a[i].ende)) {
            a[i].flags.push("ueberschneidung"); a[j].flags.push("ueberschneidung");
            hinweise.push({ p, datum: t, typ: "ueberschneidung", detail: a[i].beginn + "-" + a[i].ende + "/" + a[j].beginn + "-" + a[j].ende, text: "<b>" + esc(p.name) + "</b> – " + kurz(t) + ": " + esc(a[i].beginn + "–" + a[i].ende) + " und " + esc(a[j].beginn + "–" + a[j].ende) + " überschneiden sich." });
          }
        }
      }));
      // Name nicht in der Mitarbeiterliste (Tippfehler oder ausgeschieden)
      if (daten.mitarbeiter.length) liste.forEach((p) => { if (!p.inListe) hinweise.push({ p, typ: "name", text: "<b>" + esc(p.name) + "</b> steht nicht in der Mitarbeiterliste (Schreibweise prüfen)." }); });
      // Seit mehreren Werktagen nichts eingetragen (nur im laufenden Monat)
      if (monat === daten.heute.slice(0, 7)) liste.forEach((p) => {
        if (!p.inListe) return;
        const tage = Object.keys(p.tage).sort(); if (!tage.length) return;
        const offen = tageZwischen(tage[tage.length - 1], daten.heute).slice(1).filter((t) => werktag(t) && t < daten.heute);
        if (offen.length >= 3) hinweise.push({ p, typ: "luecke", datum: tage[tage.length - 1], text: "<b>" + esc(p.name) + "</b> – seit " + kurz(tage[tage.length - 1]) + " nichts mehr eingetragen (" + offen.length + " Werktage)." });
      });
      // Abgearbeitete Hinweise: Schlüssel bleibt gleich, solange sich der Sachverhalt nicht ändert (Reiter "Hinweise erledigt")
      const erledigt = new Set(daten.erledigt || []);
      hinweise.forEach((h) => { h.key = [h.typ, norm(h.p.name), h.datum || "", h.detail || ""].join("|"); h.erledigt = erledigt.has(h.key); });
      personen = [...liste.values()];
      const konto = new Map((daten.konto || []).map((k) => [norm(k.name), k]));
      personen.forEach((p) => { p.flags = hinweise.filter((h) => h.p === p && !h.erledigt).length; p.konto = konto.get(norm(p.name)) || null; });
      if (gewaehlt) gewaehlt = personen.find((p) => norm(p.name) === norm(gewaehlt.name)) || null;
    }

    // ---------- Anzeige ----------
    function sichtbar() { return personen.filter((p) => !suche || norm(p.name).includes(suche)); }
    const ICON = { urlaub: ["U", "#0284c7"], doppelt: ["2×", "#e11d48"], ueberschneidung: ["↔", "#ea580c"], fahrzeug: ["?", "#ca8a04"], name: ["Aa", "#7c3aed"], luecke: ["…", "#64748b"] };

    function zeichne() {
      $("monat-text").textContent = monatText(monat);
      $("nach").disabled = monat >= (backendAb("2.7") ? monatPlus(daten.heute.slice(0, 7), 12) : daten.heute.slice(0, 7));   // Urlaubsplanung: bis 12 Monate voraus
      const l = sichtbar(), heute = daten.heute, laufend = monat === heute.slice(0, 7);
      const mitEintrag = l.filter((p) => Object.keys(p.tage).length);
      const heuteDa = l.filter((p) => (p.tage[heute] || []).length);
      const abwesend = l.filter((p) => (p.tage[heute] || []).some((x) => x.art !== "arbeit"));
      $("kacheln").innerHTML =
        '<div class="kachel"><small>Stunden ' + esc(monatText(monat).split(" ")[0]) + "</small><strong>" + std(l.reduce((a, p) => a + p.summe, 0)) + "</strong> <span>netto</span></div>" +
        '<div class="kachel"><small>Mitarbeiter</small><strong>' + mitEintrag.length + "</strong> <span>mit Einträgen</span></div>" +
        '<div class="kachel"><small>Heute eingetragen</small><strong>' + (laufend ? heuteDa.length : "–") + "</strong> <span>" + (laufend ? kurz(heute) : "nur im lfd. Monat") + "</span></div>" +
        '<div class="kachel"><small>Urlaub / Krank heute</small><strong>' + (laufend ? abwesend.length : "–") + "</strong> <span>Mitarbeiter</span></div>";
      const anzahl = hinweise.filter((h) => l.includes(h.p) && !h.erledigt).length;
      $("z-hinweise").textContent = anzahl; $("z-hinweise").classList.toggle("null", !anzahl);
      const offen = (daten.antraege || []).filter((a) => a.status === "beantragt").length;
      $("reiter-urlaub").hidden = !backendAb("2.7");
      $("z-antraege").textContent = offen; $("z-antraege").classList.toggle("null", !offen);
      $("app").classList.toggle("plan", ansicht === "urlaub");
      kalenderLeiste();
      links(l, heute, laufend); rechts();
      $("stand").textContent = (DEMO ? "DEMO – erfundene Daten · " : "") + "Stand " + new Date(daten.stand).toLocaleString("de-DE");
    }

    function zeile(p, rechtsText, metaHtml, balken) {
      return '<div class="zeile' + (gewaehlt === p ? " an" : "") + '" data-n="' + esc(p.name) + '"><div class="ava" style="background:' + (p.inListe ? farbe(p.name) : "#94a3b8") + '">' + esc(initialen(p.name)) + '</div><div><div class="name">' + esc(p.name) + '</div><div class="meta">' + metaHtml + "</div>" + (balken != null ? '<div class="balken"><i style="width:' + balken + '%"></i></div>' : "") + '</div><div class="std">' + rechtsText + "</div></div>";
    }

    function links(l, heute, laufend) {
      if (ansicht === "monat") {
        const max = Math.max(1, ...l.map((p) => p.summe));
        const mit = l.filter((p) => Object.keys(p.tage).length).sort((a, b) => b.summe - a.summe);
        $("links").innerHTML = "<h2>" + esc(monatText(monat)) + " <small>" + mit.length + " Mitarbeiter · nach Stunden</small></h2>" + (mit.length ? mit.map((p) => {
          const tage = Object.values(p.tage), arbeit = tage.filter((t) => t.some((x) => x.art === "arbeit")).length;
          const u = tage.filter((t) => t.some((x) => x.art === "urlaub")).length, k = tage.filter((t) => t.some((x) => x.art === "krank")).length;
          const ue = p.konto && p.konto.vorher && !p.konto.aktuell ? p.konto.vorher.uebertragNeu : 0;
          return zeile(p, std(p.summe) + "<small>Std.</small>", '<span class="pill">' + arbeit + " Tage</span>" + (u ? '<span class="pill u">Urlaub ' + u + "</span>" : "") + (k ? '<span class="pill k">Krank ' + k + "</span>" : "") + (p.flags ? '<span class="pill w">' + p.flags + (p.flags === 1 ? " Hinweis" : " Hinweise") + "</span>" : "") +
            (p.konto && p.konto.aktuell ? '<span class="pill ok">abgeschlossen</span>' : ue ? '<span class="pill">Übertrag ' + (ue > 0 ? "+" : "−") + std(Math.abs(ue)) + "</span>" : ""), Math.round(p.summe / max * 100));
        }).join("") : '<div class="leer">Keine Einträge in diesem Monat.</div>');
      } else if (ansicht === "heute") {
        if (!laufend) { $("links").innerHTML = '<div class="leer">„Heute“ gibt es nur im laufenden Monat.</div>'; bindeKlicks(); return; }
        const da = l.filter((p) => (p.tage[heute] || []).length);
        const vor7 = isoVon(new Date(alsDatum(heute).getTime() - 7 * 86400000));
        const fehlt = l.filter((p) => p.inListe && !da.includes(p) && Object.keys(p.tage).some((t) => t >= vor7 && t < heute && p.tage[t].some((x) => x.art === "arbeit")));
        $("links").innerHTML = "<h2>Heute · " + kurz(heute) + " <small>" + da.length + " eingetragen</small></h2>" +
          (da.length ? da.map((p) => { const es = p.tage[heute]; const a = es.filter((x) => x.art === "arbeit");
            return zeile(p, std(es.reduce((s, x) => s + (x.doppelt ? 0 : x.netto), 0)) + "<small>Std.</small>", a.map((x) => '<span class="pill">' + esc(x.beginn + "–" + x.ende) + "</span>" + (x.fahrzeug ? '<span class="pill">' + esc(x.fahrzeug) + "</span>" : "")).join("") + (es.some((x) => x.art === "urlaub") ? '<span class="pill u">Urlaub</span>' : "") + (es.some((x) => x.art === "krank") ? '<span class="pill k">Krank</span>' : "")); }).join("") : '<div class="leer">Heute hat noch niemand eingetragen.</div>') +
          '<h2 style="border-top:1px solid var(--linie)">Noch nichts eingetragen <small>in den letzten 7 Tagen im Einsatz</small></h2>' +
          (fehlt.length ? fehlt.map((p) => zeile(p, '<span style="color:var(--leise)">–</span>', '<span class="pill">zuletzt ' + kurz(Object.keys(p.tage).sort().pop()) + "</span>")).join("") : '<div class="leer">Alle haben eingetragen.</div>');
      } else if (ansicht === "urlaub") {
        urlaubAnsicht(); return;
      } else if (ansicht === "team") {
        teamAnsicht(); return;
      } else {
        const h = hinweise.filter((x) => l.includes(x.p)), offen = h.filter((x) => !x.erledigt), fertig = h.filter((x) => x.erledigt);
        const hz = (x) => '<div class="hinweis' + (x.erledigt ? " ist-erledigt" : "") + '" data-n="' + esc(x.p.name) + '"><span class="i" style="background:' + ICON[x.typ][1] + '">' + ICON[x.typ][0] + "</span><div>" + x.text + "</div>" +
          '<button type="button" class="erl' + (x.erledigt ? " zurueck" : "") + '" data-erl="' + hinweise.indexOf(x) + '">' + (x.erledigt ? "Zurückholen" : "✓ Erledigt") + "</button></div>";
        $("links").innerHTML = "<h2>Hinweise <small>zum Klären</small></h2>" + (offen.length ? offen.map(hz).join("") : '<div class="leer">Keine offenen Hinweise. 👍</div>') +
          (fertig.length ? '<details class="erledigt-liste"><summary>Erledigt (' + fertig.length + ")</summary>" + fertig.map(hz).join("") + "</details>" : "");
        document.querySelectorAll("#links [data-erl]").forEach((b) => b.addEventListener("click", (ev) => { ev.stopPropagation(); const x = hinweise[+b.dataset.erl]; hinweisErledigen(x, !x.erledigt); }));
      }
      bindeKlicks();
    }
    // ---------- Mitarbeiter pflegen ----------
    function teamZeile(m, knopf) {
      return '<div class="zeile team"><div class="ava" style="background:' + (m.aktiv ? farbe(m.name) : "#94a3b8") + '">' + esc(initialen(m.name)) + '</div><div><div class="name">' + esc(m.name) + '</div><div class="meta">' + (m.datev ? '<span class="pill">DATEV ' + esc(m.datev) + "</span>" : "") + (m.urlaubJahr != null ? '<span class="pill u">Urlaub ' + zahlText(m.urlaubJahr + (m.uebertrag || 0)) + " Tage</span>" : "") + "</div></div><div>" + knopf + "</div></div>";
    }
    function teamAnsicht() {
      const alle = daten.mitarbeiterAlle || daten.mitarbeiter.map((m) => ({ name: m.name, aktiv: true, datev: "" }));
      const passt = (m) => !suche || norm(m.name).includes(suche);
      const aktiv = alle.filter((m) => m.aktiv && passt(m)), weg = alle.filter((m) => !m.aktiv && passt(m));
      $("links").innerHTML = "<h2>Mitarbeiter <small>" + alle.filter((m) => m.aktiv).length + " aktiv · stehen in der Zeiterfassung zur Auswahl</small></h2>" +
        '<form class="team-form" id="team-form" autocomplete="off"><input id="neu-name" placeholder="Vor- und Nachname" aria-label="Name neuer Mitarbeiter" /><input id="neu-datev" placeholder="DATEV-Nr." inputmode="numeric" aria-label="DATEV-Nummer (optional)" /><button class="knopf-klein gruen" type="submit">+ Hinzufügen</button></form>' +
        (aktiv.length ? aktiv.map((m) => teamZeile(m, '<div class="team-knoepfe">' + (backendAb("2.7") ? '<button type="button" class="knopf-klein zurueck" data-op="anspruch" data-name="' + esc(m.name) + '">Urlaub</button>' : "") +
          (backendNeu() ? '<button type="button" class="knopf-klein zurueck" data-op="umbenennen" data-name="' + esc(m.name) + '">Umbenennen</button>' : "") +
          '<button type="button" class="knopf-klein weg" data-op="entfernen" data-name="' + esc(m.name) + '">Entfernen</button></div>')).join("") : '<div class="leer">Kein Treffer.</div>') +
        (weg.length ? '<h2 style="border-top:1px solid var(--linie)">Ausgeschieden <small>' + weg.length + "</small></h2>" + weg.map((m) => teamZeile(m, '<button type="button" class="knopf-klein zurueck" data-op="hinzufuegen" data-name="' + esc(m.name) + '">Wieder aufnehmen</button>')).join("") : "");
      $("team-form").addEventListener("submit", (ev) => {
        ev.preventDefault();
        const name = $("neu-name").value.trim().replace(/\s+/g, " ");
        if (name.split(" ").length < 2) { toast("Bitte Vor- und Nachnamen eingeben.", true); $("neu-name").focus(); return; }
        mitarbeiterAktion("hinzufuegen", name, $("neu-datev").value.trim());
      });
      document.querySelectorAll("#links [data-op]").forEach((b) => b.addEventListener("click", () => {
        if (b.dataset.op === "umbenennen") { umbenennenFormular(b, b.dataset.name); return; }
        if (b.dataset.op === "anspruch") { anspruchFormular(b, b.dataset.name); return; }
        if (b.dataset.op === "entfernen" && !b.classList.contains("sicher")) {   // zweiter Klick bestätigt
          b.classList.add("sicher"); b.textContent = "Wirklich entfernen?";
          setTimeout(() => { if (b.isConnected) { b.classList.remove("sicher"); b.textContent = "Entfernen"; } }, 6000);
          return;
        }
        mitarbeiterAktion(b.dataset.op, b.dataset.name);
      }));
    }
    // Name korrigieren (Tippfehler vom Steuerberater usw.): ändert die Liste und alle Einträge in der Tabelle
    function umbenennenFormular(knopf, name) {
      document.querySelectorAll(".korr").forEach((f) => f.remove());
      const f = document.createElement("div");
      f.className = "korr";
      f.innerHTML = '<div class="korr-kopf">Name von <b>' + esc(name) + "</b> korrigieren. Alle Einträge in der Tabelle (Arbeitszeiten, Abzüge, Stundenkonto, auch frühere Monate) bekommen den neuen Namen. Steht der neue Name schon in der Liste, werden beide zusammengeführt.</div>" +
        '<div class="korr-zeile einzeln"><label class="grund">Richtiger Name<input type="text" class="k-neu" value="' + esc(name) + '" /></label></div>' +
        '<div class="korr-knoepfe"><button type="button" class="speichern">Namen ändern</button><button type="button" class="neben">Abbrechen</button></div>';
      knopf.closest(".zeile").after(f);
      const inp = f.querySelector(".k-neu");
      f.querySelector(".neben").addEventListener("click", () => f.remove());
      f.querySelector(".speichern").addEventListener("click", () => {
        const neu = inp.value.trim().replace(/\s+/g, " ");
        if (neu.split(" ").length < 2) { toast("Bitte Vor- und Nachnamen eingeben.", true); inp.focus(); return; }
        if (neu === name) { f.remove(); return; }
        mitarbeiterAktion("umbenennen", name, "", neu);
      });
      inp.focus(); inp.select();
    }
    // Urlaubsanspruch je Jahr + Übertrag aus dem Vorjahr (für den Resturlaub in App und Urlaubsplan)
    function anspruchFormular(knopf, name) {
      document.querySelectorAll(".korr").forEach((f) => f.remove());
      const m = (daten.mitarbeiterAlle || []).find((x) => x.name === name) || {};
      const f = document.createElement("div");
      f.className = "korr";
      f.innerHTML = '<div class="korr-kopf">Urlaubsanspruch von <b>' + esc(name) + "</b> (ganze Tage, Werktage):</div>" +
        '<div class="korr-zeile fahrzeug-zeile"><label>Urlaubstage pro Jahr<input type="number" class="k-jahr" min="0" max="60" step="0.5" value="' + (m.urlaubJahr != null ? m.urlaubJahr : "") + '" /></label>' +
        '<label>Übertrag aus dem Vorjahr<input type="number" class="k-ueb" min="-60" max="60" step="0.5" value="' + (m.uebertrag || "") + '" /></label></div>' +
        '<div class="korr-knoepfe"><button type="button" class="speichern">Speichern</button><button type="button" class="neben">Abbrechen</button></div>';
      knopf.closest(".zeile").after(f);
      f.querySelector(".neben").addEventListener("click", () => f.remove());
      f.querySelector(".speichern").addEventListener("click", () => mitarbeiterAktion("anspruch", name, "", "", { urlaubJahr: f.querySelector(".k-jahr").value, uebertrag: f.querySelector(".k-ueb").value }));
      f.querySelector(".k-jahr").focus();
    }
    async function mitarbeiterAktion(op, name, datev, neu, extra) {
      $("laden").hidden = false;
      let r;
      try { r = await apiPost(Object.assign({ aktion: "mitarbeiter", op: op, pin: speicherS("az_dispo_pin"), name: name, datev: datev || "", neu: neu || "" }, extra)); }
      catch (e) { r = { status: "error", message: "Keine Verbindung – nichts geändert." }; }
      $("laden").hidden = true;
      if (r.status === "ok" && op === "umbenennen") {   // Einträge haben sich geändert: alles neu laden
        if (gewaehlt && norm(gewaehlt.name) === norm(r.alt)) gewaehlt = { name: r.neu };
        toast("Name geändert: " + r.alt + " → " + r.neu + " (" + r.eintraege + (r.eintraege === 1 ? " Eintrag)" : " Einträge)"));
        await lade(speicherS("az_dispo_pin"));
      } else if (r.status === "ok") {
        daten.mitarbeiterAlle = r.mitarbeiterAlle;
        daten.mitarbeiter = r.mitarbeiterAlle.filter((m) => m.aktiv).map((m) => ({ name: m.name, standort: "EU" }));
        auswerten(); zeichne();
        toast(op === "entfernen" ? name + " entfernt" : op === "anspruch" ? "Urlaubsanspruch von " + name + " gespeichert" : name + " ist in der Liste");
      } else if (r.status === "pin" || r.status === "gesperrt") { toast(r.message, true); $("abmelden").click(); }
      else toast(r.message || "Fehler.", true);
    }
    async function hinweisErledigen(h, an) {
      const d = document.createElement("div"); d.innerHTML = h.text;
      $("laden").hidden = false;
      let r;
      try { r = await apiPost({ aktion: "hinweis", bereich: "stunden", op: an ? "erledigt" : "zurueck", pin: speicherS("az_dispo_pin"), schluessel: h.key, text: d.textContent }); }
      catch (e) { r = { status: "error", message: "Keine Verbindung – nichts geändert." }; }
      $("laden").hidden = true;
      if (r.status === "ok") { daten.erledigt = r.erledigt; auswerten(); zeichne(); toast(an ? "Hinweis erledigt" : "Hinweis wieder offen"); }
      else if (r.status === "pin" || r.status === "gesperrt") { toast(r.message, true); $("abmelden").click(); }
      else toast(r.message || "Fehler.", true);
    }
    function toast(text, fehler) {
      const t = document.createElement("div"); t.className = "toast" + (fehler ? " fehler" : ""); t.textContent = text;
      document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
    }

    function bindeKlicks() {
      document.querySelectorAll("#links [data-n]").forEach((z) => z.addEventListener("click", () => {
        gewaehlt = personen.find((p) => p.name === z.dataset.n) || null; zeichne();
        if (innerWidth < 820) $("rechts").scrollIntoView({ behavior: "smooth" });
      }));
    }

    let aktionen = [];
    function rechts() {
      const p = gewaehlt;
      aktionen = [];
      if (!p) { $("rechts").innerHTML = '<div class="leer">Mitarbeiter anklicken, um die einzelnen Tage zu sehen.</div>'; return; }
      const anfang = monat + "-01", letzter = isoVon(new Date(+monat.slice(0, 4), +monat.slice(5, 7), 0));
      // bis heute; künftige Tage nur, wenn dort schon etwas steht (z. B. geplanter Urlaub)
      const spaetester = Object.keys(p.tage).filter((t) => t.slice(0, 7) === monat).sort().pop() || "";
      const bis = monat < daten.heute.slice(0, 7) ? letzter : spaetester > daten.heute ? spaetester : monat === daten.heute.slice(0, 7) ? daten.heute : anfang;
      const knopf = (text, typ, x) => '<button type="button" class="tag-aktion" data-a="' + aktionen.push({ typ: typ, x: x }) + '">' + text + "</button>";
      const zeilen = tageZwischen(anfang, bis).map((t) => {   // aufsteigend: der 1. steht oben
        const es = p.tage[t] || [], we = !werktag(t), d = alsDatum(t);
        const dtxt = '<div class="d">' + d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) + "<small>" + (feiertag(t) ? esc(feiertag(t)) : d.toLocaleDateString("de-DE", { weekday: "long" })) + "</small></div>";
        if (!es.length) return we || t > daten.heute ? "" : '<div class="tag">' + dtxt + '<div style="color:var(--leise)">kein Eintrag</div><div></div><div class="tag-knoepfe">' + (p.inListe && backendAb("2.6") ? knopf("+ Eintrag", "nachtragen", { p: p, tag: t }) : "") + "</div></div>";
        return es.map((x) => {
          const warn = x.flags.length, cls = x.art === "urlaub" ? " urlaub" : x.art === "krank" ? " krank" : warn ? " warn" : "";
          const flags = x.flags.map((f) => '<span class="pill w">' + ({ doppelt: "doppelt", ueberschneidung: "überschneidet", fahrzeug: "Fahrzeug?" })[f] + "</span>").join(" ");
          let mitte, notiz = "", knoepfe = "";
          if (x.art === "arbeit") {
            const abzug = x.korrektur ? ' <span class="pill kor">−' + std(x.korrektur.abzug) + " Std. Abzug " + esc(x.korrektur.abzugszeit) + "</span>"
              : x.leerzeit > 0 ? ' <span class="pill">−' + std(x.leerzeit) + " Leerzeit</span>" : "";
            const fz = x.fahrzeugAlt ? ' <span class="pill kor"><span class="alt">' + esc(x.fahrzeugAlt.alt || "ohne") + "</span> → " + esc(x.fahrzeug || "ohne Fahrzeug") + "</span>"
              : ' <span class="pill">' + esc(x.fahrzeug || "ohne Fahrzeug") + "</span>";
            // Uhrzeit anklicken = Zeit ändern
            const zeit = !x.doppelt && x.zeile && backendNeu()
              ? '<button type="button" class="zeit-knopf" title="Uhrzeit oder Tag ändern" data-a="' + aktionen.push({ typ: "zeit", x: x }) + '">' + esc(x.beginn + "–" + x.ende) + " <span>✎</span></button>"
              : "<b>" + esc(x.beginn + "–" + x.ende) + "</b>";
            const za = x.zeitAlt ? ' <span class="pill kor nb">gemeldet <span class="alt">' + esc(x.zeitAlt.alt) + "</span></span>" : "";
            mitte = zeit + za + abzug + fz + " " + flags;
            notiz = (x.notiz ? '<span class="notiz">' + esc(x.notiz) + "</span>" : "") +
              (x.zeitAlt ? '<span class="notiz">' + (/^\d{2}\.\d{2}\. /.test(x.zeitAlt.alt) ? "Tag/Zeit geändert: " : "Zeit geändert: ") + esc(x.zeitAlt.grund) + (x.zeitAlt.am ? " (" + esc(x.zeitAlt.am) + ")" : "") + "</span>" : "") +
              (x.korrektur ? '<span class="notiz">Abzug: ' + esc(x.korrektur.grund) + (x.korrektur.am ? " (" + esc(x.korrektur.am) + ")" : "") + "</span>" : "") +
              (x.fahrzeugAlt ? '<span class="notiz">Fahrzeug geändert: ' + esc(x.fahrzeugAlt.grund) + (x.fahrzeugAlt.am ? " (" + esc(x.fahrzeugAlt.am) + ")" : "") + "</span>" : "");
            if (!x.doppelt && x.zeile) knoepfe = knopf(x.korrektur ? "Abzug ändern" : "Abzug", "abzug", x) + knopf("Fahrzeug", "fahrzeug", x);
          } else {
            const q = x.quelle || {};
            mitte = (x.art === "urlaub" ? '<span class="pill u">Urlaub</span>' : '<span class="pill k">Krank</span>') +
              (q.von ? ' <span class="pill">' + kurz(q.von) + " – " + kurz(q.bis) + "</span>" : "") + (x.stundenOffen ? ' <span class="pill w">Stunden fehlen</span>' : "") + " " + flags;
            // jeder Urlaubs-/Krankheitstag hat den Knopf; die Stunden gelten für den ganzen Zeitraum (Krank erst ab Backend 2.5)
            if (q.zeile && !x.doppelt && (x.art === "urlaub" || backendNeu())) knoepfe = knopf(x.stundenOffen ? "Stunden eintragen" : backendAb("2.6") ? "Gesamt ändern" : "Stunden ändern", "urlaub", x);
            if (q.zeile && !x.doppelt && backendAb("2.7")) knoepfe += knopf("Zeitraum", "zeitraum", x);
          }
          let stunden = x.stundenOffen ? '<span style="color:var(--leise)">–</span>' : x.doppelt ? '<s style="color:var(--leise)">' + std(x.netto) + "</s>" : std(x.netto);
          // Urlaub/Krank: Stunden dieses Tages anklicken = nur diesen Tag ändern
          if (x.art !== "arbeit" && x.quelle && x.quelle.zeile && !x.doppelt && backendAb("2.6"))
            stunden = '<button type="button" class="zeit-knopf" title="Stunden an diesem Tag ändern" data-a="' + aktionen.push({ typ: "tag", x: x }) + '">' + (x.stundenOffen ? "–" : std(x.netto)) + " <span>✎</span></button>";
          return '<div class="tag' + cls + (x.korrektur || x.fahrzeugAlt || x.zeitAlt ? " korrigiert" : "") + (we ? " we" : "") + '">' + dtxt + "<div>" + mitte + notiz + '</div><div class="h">' + stunden + '</div><div class="tag-knoepfe">' + knoepfe + "</div></div>";
        }).join("");
      }).join("");
      $("rechts").innerHTML = '<div class="detail-kopf"><div class="ava" style="background:' + (p.inListe ? farbe(p.name) : "#94a3b8") + '">' + esc(initialen(p.name)) + '</div><div><strong>' + esc(p.name) + "</strong>" + (p.inListe ? (backendAb("2.6") ? "<br>" + knopf("+ Eintrag nachtragen", "nachtragen", { p: p, tag: bis }) : "") : '<span class="pill w">nicht in der Liste</span>' + (backendNeu() ? "<br>" + knopf("Namen zuordnen …", "zuordnen", { p: p }) : "")) + '</div><div class="gross">' + std(p.summe) + "<small>Std. netto " + esc(monatName(monat)) + "</small></div></div>" + kontoBox(p, knopf) + zeilen;
      document.querySelectorAll("#rechts [data-a]").forEach((b) => b.addEventListener("click", () => {
        const a = aktionen[+b.dataset.a - 1];
        ({ abzug: abzugFormular, fahrzeug: fahrzeugFormular, urlaub: urlaubFormular, zeit: zeitFormular, konto: kontoFormular, zuordnen: zuordnenFormular, tag: tagFormular, nachtragen: nachtragenFormular, zeitraum: zeitraumFormular })[a.typ](b, a.x);
      }));
    }

    // Stundenkonto: Übertrag aus dem Vormonat + Stunden im Monat − ausbezahlt (DATEV-Lohnabrechnung) = Übertrag in den nächsten Monat
    const mitVorzeichen = (x) => (x > 0.004 ? "+" : x < -0.004 ? "−" : "") + std(Math.abs(x));
    function kontoBox(p, knopf) {
      if (!backendNeu()) return "";
      const k = p.konto || {}, vorher = k.vorher, akt = k.aktuell, ist = rund(p.summe);
      const alt = akt ? akt.uebertragAlt : vorher ? vorher.uebertragNeu : 0;
      const feld = (titel, wert, cls) => '<div class="konto-feld' + (cls ? " " + cls : "") + '"><small>' + titel + "</small><b>" + wert + "</b></div>";
      return '<div class="konto"><div class="konto-kopf"><b>Stundenkonto</b>' +
        (akt ? '<span class="pill ok">' + esc(monatName(monat)) + " abgeschlossen</span>" : '<span class="pill">' + esc(monatName(monat)) + " offen</span>") +
        knopf(akt ? "Abschluss ändern" : "Monat abschließen", "konto", { p: p }) + "</div>" +
        '<div class="konto-reihe">' +
          feld("Übertrag " + esc(vorher ? monatName(vorher.monat) : "Vormonat"), mitVorzeichen(alt)) +
          feld("+ Stunden " + esc(monatName(monat)), std(akt ? akt.stunden : ist)) +
          feld("− ausbezahlt", akt ? std(akt.ausbezahlt) : "offen", akt ? "" : "leise") +
          feld("= Übertrag " + esc(monatName(monatPlus(monat, 1))), mitVorzeichen(akt ? akt.uebertragNeu : rund(alt + ist)), akt ? "summe" : "summe leise") +
        "</div>" +
        (akt && Math.abs(akt.stunden - ist) >= 0.01 ? '<div class="konto-warn">Die Stunden haben sich seit dem Abschluss geändert (abgeschlossen ' + std(akt.stunden) + ", jetzt " + std(ist) + " Std.). Bitte neu abschließen.</div>" : "") +
        (akt && (akt.bemerkung || akt.am) ? '<div class="konto-notiz">' + esc([akt.bemerkung, akt.am ? "gespeichert " + akt.am : ""].filter(Boolean).join(" · ")) + "</div>" : "") + "</div>";
    }

    // ---------- Abzug, Fahrzeug, Urlaubsstunden ----------
    function nettoAus(b, e) { const brutto = (minuten(e) - minuten(b)) / 60; return Math.round((brutto - (brutto >= 8 ? 0.75 : brutto >= 6 ? 0.5 : 0)) * 100) / 100; }
    const rund = (x) => Math.round(x * 100) / 100;
    function basis(x) { return { pin: speicherS("az_dispo_pin"), zeile: x.zeile, name: x.name, datum: x.datum, beginn: x.beginn, ende: x.ende }; }
    function formularOeffnen(knopf, html) {
      document.querySelectorAll("#rechts .korr").forEach((f) => f.remove());
      const f = document.createElement("div");
      f.className = "korr"; f.innerHTML = html;
      knopf.closest(".tag, .konto, .detail-kopf, .uplan-box").after(f);
      f.querySelector(".neben").addEventListener("click", () => f.remove());
      return f;
    }
    async function aktionSenden(body, okText) {
      $("laden").hidden = false;
      let r;
      try { r = await apiPost(body); } catch (err) { r = { status: "error", message: "Keine Verbindung – nichts geändert." }; }
      $("laden").hidden = true;
      if (r.status === "ok") { toast(okText(r)); await lade(speicherS("az_dispo_pin")); }
      else if (r.status === "pin" || r.status === "gesperrt") { toast(r.message, true); $("abmelden").click(); }
      else toast(r.message || "Fehler.", true);
    }

    // Abzugszeit: z. B. Standzeit 10:00–12:00 → diese Dauer wird abgezogen, die gemeldete Zeit bleibt sichtbar
    function abzugFormular(knopf, x) {
      const vorher = x.korrektur ? x.korrektur.abzugszeit.split(/\s*,\s*/).map((t) => t.split("–")) : [["", ""]];
      const f = formularOeffnen(knopf, '<div class="korr-kopf">Gemeldet: <b>' + esc(x.beginn + "–" + x.ende) + "</b> · " + std(x.nettoGemeldet) + " Std. netto. Abzugszeit eintragen (z. B. Standzeit):</div>" +
        '<div class="fenster"></div><button type="button" class="link-plus">+ weitere Abzugszeit</button>' +
        '<div class="korr-zeile einzeln"><label class="grund">Grund<input type="text" class="k-g" placeholder="z. B. Standzeit, Fahrzeug stand laut GPS" value="' + esc(x.korrektur ? x.korrektur.grund : "") + '" /></label></div>' +
        '<div class="korr-vorschau"></div><div class="korr-knoepfe"><button type="button" class="speichern">Abzug speichern</button><button type="button" class="neben">Abbrechen</button>' +
        (x.korrektur ? '<button type="button" class="aufheben">Abzug entfernen</button>' : "") + "</div>");
      const box = f.querySelector(".fenster"), g = f.querySelector(".k-g"), vs = f.querySelector(".korr-vorschau"), sp = f.querySelector(".speichern");
      const fenster = () => [...box.querySelectorAll(".fenster-zeile")].map((z) => ({ von: z.querySelector(".k-von").value, bis: z.querySelector(".k-bis").value }));
      function zeileNeu(von, bis) {
        const d = document.createElement("div");
        d.className = "korr-zeile fenster-zeile";
        d.innerHTML = '<label>Von<input type="time" class="k-von" value="' + esc(von || "") + '" /></label><label>Bis<input type="time" class="k-bis" value="' + esc(bis || "") + '" /></label><button type="button" class="x-klein" title="Abzugszeit entfernen">×</button>';
        d.querySelector(".x-klein").addEventListener("click", () => { if (box.children.length > 1) { d.remove(); vorschau(); } });
        d.querySelectorAll("input").forEach((i) => i.addEventListener("input", vorschau));
        box.appendChild(d);
        return d;
      }
      function vorschau() {
        const fe = fenster(); let summe = 0;
        const fehler = (t) => { vs.innerHTML = '<span class="warn">' + t + "</span>"; sp.disabled = true; };
        for (let i = 0; i < fe.length; i++) {
          const w = fe[i];
          if (!w.von || !w.bis) return fehler("Bitte bei jeder Abzugszeit von und bis eintragen.");
          if (minuten(w.bis) <= minuten(w.von)) return fehler("„Bis“ muss nach „von“ liegen.");
          if (minuten(w.von) < minuten(x.beginn) || minuten(w.bis) > minuten(x.ende)) return fehler("Die Abzugszeit muss in der gemeldeten Zeit " + esc(x.beginn + "–" + x.ende) + " liegen.");
          for (let j = 0; j < i; j++) if (minuten(w.von) < minuten(fe[j].bis) && minuten(fe[j].von) < minuten(w.bis)) return fehler("Die Abzugszeiten überschneiden sich.");
          summe += (minuten(w.bis) - minuten(w.von)) / 60;
        }
        summe = rund(summe);
        if (summe > x.nettoGemeldet) return fehler("Der Abzug ist größer als die gemeldeten Stunden.");
        vs.innerHTML = 'Abzug <span class="minus">−' + std(summe) + " Std.</span> → <b>neu " + std(rund(x.nettoGemeldet - summe)) + " Std. netto</b> (gemeldet " + std(x.nettoGemeldet) + ")";
        sp.disabled = false;
      }
      vorher.forEach((v) => zeileNeu(v[0], v[1]));
      f.querySelector(".link-plus").addEventListener("click", () => { zeileNeu().querySelector(".k-von").focus(); vorschau(); });
      vorschau();
      sp.addEventListener("click", () => {
        if (!g.value.trim()) { g.focus(); toast("Bitte einen Grund angeben.", true); return; }
        aktionSenden(Object.assign(basis(x), { aktion: "korrektur", abzuege: fenster(), grund: g.value.trim() }), (r) => "Abzug gespeichert: " + std(r.nettoGemeldet) + " → " + std(r.nettoNeu) + " Std.");
      });
      const auf = f.querySelector(".aufheben"); if (auf) auf.addEventListener("click", () => aktionSenden(Object.assign(basis(x), { aktion: "korrektur", aufheben: true }), () => "Abzug entfernt"));
      box.querySelector(".k-von").focus();
    }

    // Fahrzeug ändern: falsch angetipptes Fahrzeug korrigieren (z. B. nach Blick in DMRZ)
    function fahrzeugFormular(knopf, x) {
      const liste = daten.fahrzeugListe || daten.fahrzeuge.map((k) => ({ kennzeichen: k, name: "", kategorie: "" }));
      const gruppen = {};
      liste.forEach((fz) => { const g = fz.kategorie || "Weitere"; (gruppen[g] = gruppen[g] || []).push(fz); });
      const optionen = '<option value="">Ohne Fahrzeug</option>' + Object.keys(gruppen).sort((a, b) => a === "Verliehen" ? 1 : b === "Verliehen" ? -1 : a.localeCompare(b)).map((g) =>
        '<optgroup label="' + esc(g) + '">' + gruppen[g].map((fz) => '<option value="' + esc(fz.kennzeichen) + '"' + (normKz(fz.kennzeichen) === normKz(x.fahrzeug) ? " selected" : "") + ">" + esc(fz.kennzeichen + (fz.name ? " · " + fz.name : "")) + "</option>").join("") + "</optgroup>").join("");
      const f = formularOeffnen(knopf, '<div class="korr-kopf">Eingetragen: <b>' + esc(x.fahrzeug || "ohne Fahrzeug") + "</b>. Richtiges Fahrzeug wählen (z. B. laut DMRZ):</div>" +
        '<div class="korr-zeile fahrzeug-zeile"><label>Fahrzeug<select class="k-fz">' + optionen + '</select></label><label class="grund">Grund <span style="font-weight:500">(optional)</span><input type="text" class="k-g" placeholder="z. B. laut DMRZ" /></label></div>' +
        '<div class="korr-knoepfe"><button type="button" class="speichern">Fahrzeug speichern</button><button type="button" class="neben">Abbrechen</button></div>');
      const sel = f.querySelector(".k-fz"), sp = f.querySelector(".speichern");
      const pruefe = () => { sp.disabled = normKz(sel.value) === normKz(x.fahrzeug); };
      sel.addEventListener("change", pruefe); pruefe();
      sp.addEventListener("click", () => aktionSenden(Object.assign(basis(x), { aktion: "fahrzeug", fahrzeug: sel.value, altFz: x.fahrzeug, grund: f.querySelector(".k-g").value.trim() }),
        (r) => "Fahrzeug geändert: " + (r.alt || "ohne") + " → " + (r.neu || "ohne")));
      sel.focus();
    }

    // Uhrzeit ändern: falsch gemeldete Zeit korrigieren; Brutto, Pause und Netto rechnet das Backend neu
    function zeitFormular(knopf, x) {
      const mitTag = backendAb("2.8");   // ab 2.8: auch der Tag ist änderbar (Mitarbeiter hat sich im Datum vertan)
      const f = formularOeffnen(knopf, '<div class="korr-kopf">Eingetragen: <b>' + kurz(x.datum) + " " + esc(x.beginn + "–" + x.ende) + "</b> · " + std(x.nettoGemeldet) + " Std. netto" +
        (x.zeitAlt ? " (gemeldet war " + esc(x.zeitAlt.alt) + ")" : "") + ". Richtige " + (mitTag ? "Uhrzeit oder richtigen Tag" : "Uhrzeit") + " eintragen:</div>" +
        (mitTag ? '<div class="korr-zeile fahrzeug-zeile" style="margin-bottom:.5rem"><label>Tag<input type="date" class="k-tag" value="' + esc(x.datum) + '" max="' + esc(daten.heute) + '" /></label><div class="hinweis-klein">Nur ändern, wenn sich der Mitarbeiter im Datum vertan hat.</div></div>' : "") +
        '<div class="korr-zeile"><label>Beginn<input type="time" class="k-von" value="' + esc(x.beginn) + '" /></label><label>Ende<input type="time" class="k-bis" value="' + esc(x.ende) + '" /></label>' +
        '<label class="grund">Grund<input type="text" class="k-g" placeholder="z. B. laut DMRZ, Tippfehler" /></label></div>' +
        '<div class="korr-vorschau"></div><div class="korr-knoepfe"><button type="button" class="speichern">Zeit speichern</button><button type="button" class="neben">Abbrechen</button></div>');
      const von = f.querySelector(".k-von"), bis = f.querySelector(".k-bis"), g = f.querySelector(".k-g"), vs = f.querySelector(".korr-vorschau"), sp = f.querySelector(".speichern"), tagF = f.querySelector(".k-tag");
      const tag = () => (tagF && tagF.value) || x.datum;
      function vorschau() {
        const fehler = (t) => { vs.innerHTML = '<span class="warn">' + t + "</span>"; sp.disabled = true; };
        if (!von.value || !bis.value) return fehler("Bitte Beginn und Ende eintragen.");
        if (minuten(bis.value) <= minuten(von.value)) return fehler("Das Ende muss nach dem Beginn liegen.");
        if (tag() > daten.heute) return fehler("Der Tag liegt in der Zukunft.");
        if (von.value === x.beginn && bis.value === x.ende && tag() === x.datum) { vs.textContent = ""; sp.disabled = true; return; }
        const n = nettoAus(von.value, bis.value), lz = x.leerzeit || 0;
        vs.innerHTML = "Neu: " + (tag() !== x.datum ? "<b>" + kurz(tag()) + "</b> " : "") + esc(von.value + "–" + bis.value) + " → <b>" + std(lz ? rund(n - lz) : n) + " Std. netto</b>" + (lz ? " (" + std(n) + " − " + std(lz) + " Abzug)" : "") + " · bisher " + std(x.netto);
        sp.disabled = false;
      }
      [von, bis, tagF].filter(Boolean).forEach((i) => i.addEventListener("input", vorschau)); vorschau();
      sp.addEventListener("click", () => {
        if (!g.value.trim()) { g.focus(); toast("Bitte einen Grund angeben.", true); return; }
        aktionSenden(Object.assign(basis(x), { aktion: "zeit", neuBeginn: von.value, neuEnde: bis.value, grund: g.value.trim() }, tagF && tag() !== x.datum ? { neuDatum: tag() } : {}),
          (r) => (r.datum && r.datum !== x.datum ? "Tag geändert: " + kurz(x.datum) + " → " + kurz(r.datum) + ", " : "Zeit geändert: ") + r.beginn + "–" + r.ende + " (" + std(r.nettoAlt) + " → " + std(r.netto) + " Std.)");
      });
      von.focus();
    }

    // Urlaubs-/Krankstunden: bei Urlaub trägt die App nur den Zeitraum ein, die Stunden setzt die Dispo; Krank rechnet das Backend vor.
    // Vorschlag: Ø der letzten 13 Wochen je Werktag (Minijob), höchstens 8 Std. (Urlaub) bzw. 5 Std. (Krank) je Tag
    function urlaubFormular(knopf, x) {
      const q = x.quelle, tage = tageZwischen(q.von, q.bis).filter(werktag).length, art = x.art === "krank" ? "Krank" : "Urlaub";
      const f = formularOeffnen(knopf, '<div class="korr-kopf">' + art + " <b>" + kurz(q.von) + " – " + kurz(q.bis) + "</b> (" + tage + (tage === 1 ? " Werktag" : " Werktage") + "). " + (art === "Krank" ? "Krankstunden" : "Urlaubsstunden") + " für den ganzen Zeitraum:</div>" +
        '<div class="ds-box">' + (backendNeu() ? "Durchschnitt der letzten 13 Wochen wird berechnet …" : "") + "</div>" +
        '<div class="korr-zeile fahrzeug-zeile"><label>Stunden gesamt<input type="number" class="k-std" min="0" step="0.25" inputmode="decimal" value="' + (x.stundenOffen ? "" : rund(q.netto)) + '" /></label><div class="hinweis-klein">Von Hand änderbar. Leer = noch offen.</div></div>' +
        '<div class="korr-knoepfe"><button type="button" class="speichern">Stunden speichern</button><button type="button" class="neben">Abbrechen</button></div>');
      const inp = f.querySelector(".k-std"), box = f.querySelector(".ds-box");
      if (backendNeu()) apiPost({ aktion: "durchschnitt", pin: speicherS("az_dispo_pin"), name: q.name, von: q.von, bis: q.bis, art: x.art }).then((r) => {
        if (!box.isConnected) return;
        if (r.status !== "ok") { box.textContent = r.message || "Durchschnitt nicht verfügbar."; return; }
        if (!r.werktage) { box.textContent = "In den 13 Wochen davor gibt es keine Einträge. Bitte die Stunden von Hand eintragen."; return; }
        box.innerHTML = "Letzte 13 Wochen (" + kurz(r.von) + " – " + kurz(r.bis) + "): " + std(r.stunden) + " Std. an " + r.werktage + " Werktagen = Ø " + std(r.durchschnitt) + " Std./Tag" +
          (r.gedeckelt ? " → höchstens " + r.max + " Std./Tag" : "") + "<br>Vorschlag: " + r.tage + " × " + std(r.proTag) + " = <b>" + std(r.vorschlag) + " Std.</b>" +
          '<button type="button" class="link-plus ds-nehmen">Übernehmen</button>';
        box.querySelector(".ds-nehmen").addEventListener("click", () => { inp.value = r.vorschlag; inp.focus(); });
        if (x.stundenOffen && inp.value === "") inp.value = r.vorschlag;
      }).catch(() => { if (box.isConnected) box.textContent = "Durchschnitt nicht verfügbar (keine Verbindung)."; });
      f.querySelector(".speichern").addEventListener("click", () => aktionSenden({ aktion: "urlaubstunden", pin: speicherS("az_dispo_pin"), zeile: q.zeile, name: q.name, von: q.von, stunden: inp.value },
        (r) => (art === "Krank" ? "Krankstunden" : "Urlaubsstunden") + (r.stunden === "" ? " entfernt" : " gespeichert: " + std(r.stunden) + " Std.")));
      inp.focus();
    }

    function zahlText(x) { return (Math.round(x * 10) / 10).toLocaleString("de-DE"); }

    // ---------- A: Kalender-Leiste (diese + 2 Wochen): Urlaub, Krank, offene Anträge ----------
    function kalenderLeiste() {
      const box = $("kalender");
      if (!backendAb("2.7") || !daten.kalender) { box.hidden = true; return; }
      box.hidden = false;
      const abw = new Map();
      (daten.kalender.eintraege || []).forEach((e) => abw.set(norm(e.name) + "|" + e.art + "|" + e.von + "|" + e.bis, { name: e.name, art: e.art, von: e.von, bis: e.bis }));
      (daten.antraege || []).filter((a) => a.status === "beantragt").forEach((a) => abw.set("antrag|" + a.id, { name: a.name, art: "beantragt", von: a.von, bis: a.bis, antrag: true }));
      const liste = [...abw.values()], tage = tageZwischen(daten.kalender.von, daten.kalender.bis), reihe = ["krank", "urlaub", "beantragt"];
      let html = '<div class="kal-kopf"><b>Urlaub und Krank</b><span>diese und die nächsten zwei Wochen</span><span class="kal-leg"><span><i class="kc u"></i>Urlaub</span><span><i class="kc k"></i>Krank</span><span><i class="kc b"></i>Antrag offen</span></span></div>';
      const chip = (x) => '<button type="button" class="kc ' + (x.art === "krank" ? "k" : x.art === "urlaub" ? "u" : "b") + '" title="' + esc(x.name + " · " + (x.art === "beantragt" ? "Antrag offen" : x.art === "krank" ? "krank" : "Urlaub") + " " + kurz(x.von) + " – " + kurz(x.bis)) + '" data-kal="' + esc(x.antrag ? "" : x.name) + '">';
      if (innerWidth < 640) {   // Handy: Liste der Tage, an denen jemand fehlt
        const zeilen = tage.filter(werktag).map((t) => {
          const da = liste.filter((x) => x.von <= t && x.bis >= t).sort((a, b) => reihe.indexOf(a.art) - reihe.indexOf(b.art));
          if (!da.length) return "";
          const fehlen = new Set(da.filter((x) => x.art !== "beantragt").map((x) => norm(x.name))).size;
          return '<div class="kal-zeile' + (fehlen >= WARN_AB ? " voll" : "") + '"><div class="kal-d">' + kurz(t) + (fehlen >= WARN_AB ? ' <span class="kal-warn">⚠ ' + fehlen + "</span>" : "") + "</div><div>" + da.map((x) => chip(x) + esc(x.name) + "</button>").join("") + "</div></div>";
        }).join("");
        box.innerHTML = html + (zeilen || '<div class="leer">In den nächsten drei Wochen fehlt niemand.</div>');
      } else
      for (let w = 0; w * 7 < tage.length; w++) {
        const woche = tage.slice(w * 7, w * 7 + 7);
        html += '<div class="kal-woche"><div class="kal-kw">KW ' + kw(woche[0]) + "</div>" + woche.map((t) => {
          const we = !werktag(t), ft = feiertag(t), d = alsDatum(t);
          const da = we ? [] : liste.filter((x) => x.von <= t && x.bis >= t).sort((a, b) => reihe.indexOf(a.art) - reihe.indexOf(b.art) || a.name.localeCompare(b.name, "de"));
          const fehlen = new Set(da.filter((x) => x.art !== "beantragt").map((x) => norm(x.name))).size;
          return '<div class="kal-tag' + (we ? " we" : "") + (t === daten.heute ? " heute" : "") + (fehlen >= WARN_AB ? " voll" : "") + '"><div class="kal-d">' + d.toLocaleDateString("de-DE", { weekday: "short" }) + " " + d.getDate() + "." +
            (fehlen >= WARN_AB ? ' <span class="kal-warn" title="' + fehlen + ' fehlen">⚠ ' + fehlen + "</span>" : "") + "</div>" + (ft ? '<div class="kal-ft">' + esc(ft) + "</div>" : "") +
            da.slice(0, 4).map((x) => chip(x) + esc(kurzName(x.name)) + "</button>").join("") +
            (da.length > 4 ? '<span class="kal-mehr">+' + (da.length - 4) + " weitere</span>" : "") + "</div>";
        }).join("") + "</div>";
      }
      if (innerWidth >= 640) box.innerHTML = html;
      box.querySelectorAll("[data-kal]").forEach((b) => b.addEventListener("click", () => {
        if (!b.dataset.kal) { reiterWahl("urlaub"); return; }
        gewaehlt = personen.find((p) => norm(p.name) === norm(b.dataset.kal)) || null;
        if (ansicht === "urlaub" || ansicht === "team") reiterWahl("monat"); else zeichne();
        $("rechts").scrollIntoView({ behavior: "smooth", block: "start" });
      }));
    }

    // ---------- B + C: Reiter Urlaub (offene Anträge, Monatsplan, entschiedene Anträge) ----------
    let planAlle = false;
    function urlaubAnsicht() {
      const alle = daten.antraege || [];
      const offen = alle.filter((a) => a.status === "beantragt").sort((a, b) => (a.von < b.von ? -1 : 1));
      const fertig = alle.filter((a) => a.status !== "beantragt").sort((a, b) => (a.id < b.id ? 1 : -1)).slice(0, 40);
      const txtStatus = { genehmigt: "genehmigt", abgelehnt: "abgelehnt", "zurückgezogen": "zurückgezogen" };
      $("links").innerHTML = "<h2>Offene Urlaubsanträge <small>" + (offen.length ? offen.length + " warten auf Entscheidung" : "aus der Zeiterfassung der Mitarbeiter") + "</small></h2>" +
        (offen.length ? offen.map(antragKarte).join("") : '<div class="leer">Keine offenen Anträge. 👍</div>') +
        '<h2 style="border-top:1px solid var(--linie)"><span>Urlaubsplan <select id="plan-monat" class="plan-monat" aria-label="Monat wählen">' + monatsOptionen() + '</select></span><small><button type="button" class="link-plus" id="plan-neu">+ Urlaub eintragen</button> · <button type="button" class="link-plus" id="plan-alle">' + (planAlle ? "Nur Mitarbeiter mit Abwesenheit" : "Alle Mitarbeiter zeigen") + "</button></small></h2>" + monatsplan() +
        (fertig.length ? '<details class="erledigt-liste"><summary>Entschiedene Anträge (' + fertig.length + ")</summary>" + fertig.map((a) =>
          '<div class="hinweis ist-erledigt"><span class="i" style="background:' + (a.status === "genehmigt" ? "#0284c7" : "#94a3b8") + '">' + (a.status === "genehmigt" ? "✓" : "–") + "</span><div><b>" + esc(a.name) + "</b> – " + kurz(a.von) + " – " + kurz(a.bis) + " (" + a.tage + " Tage): " + (txtStatus[a.status] || a.status) +
          (a.entschieden ? " am " + esc(a.entschieden.slice(0, 10)) : "") + (a.antwort ? " · „" + esc(a.antwort) + "“" : "") + "</div></div>").join("") + "</details>" : "");
      $("plan-alle").addEventListener("click", () => { planAlle = !planAlle; zeichne(); });
      $("plan-monat").addEventListener("change", (e) => monatWahl(e.target.value));
      $("plan-neu").addEventListener("click", (e) => planEintragen(document.querySelector("#links .uplan-box") || e.target, {}));
      // Kästchen im Plan: leer = eintragen, Urlaub/Krank = Stunden an diesem Tag, offener Antrag = zur Karte
      document.querySelectorAll("#links .uplan [data-pt]").forEach((c) => c.addEventListener("click", () => {
        const name = c.dataset.pn, t = c.dataset.pt, art = c.dataset.art;
        if (art === "beantragt") { const k = [...document.querySelectorAll("#links .antrag")].find((a) => { const x = (daten.antraege || []).find((y) => y.id === a.dataset.id); return x && norm(x.name) === norm(name); }); if (k) k.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
        if (art) { const p = personen.find((q) => norm(q.name) === norm(name)), x = p && (p.tage[t] || []).find((y) => y.art === art && !y.doppelt && y.quelle && y.quelle.zeile); if (x) tagFormular(c, x); return; }
        planEintragen(c, { name: name, tag: t });
      }));
      document.querySelectorAll("#links .uplan [data-n]").forEach((z) => z.addEventListener("click", () => { gewaehlt = personen.find((p) => p.name === z.dataset.n) || null; reiterWahl("monat"); }));
      document.querySelectorAll("#links .antrag").forEach(antragBinden);
    }
    function antragKarte(a) {
      const k = a.konto || {}, rest = k.anspruch == null ? null : k.anspruch - k.genommen - (k.beantragt - a.tage);
      const tageTxt = (n) => n + (n === 1 ? " Tag" : " Tage");
      const konf = (a.konflikte || []).map((x) => "<b>" + kurz(x.tag) + "</b>: " + x.namen.map((n) => esc(kurzName(n.name)) + (n.art === "Urlaub" ? "" : " (" + n.art + ")")).join(", ") + (x.namen.filter((n) => n.art !== "beantragt").length + 1 >= WARN_AB ? " ⚠" : ""));
      return '<div class="antrag" data-id="' + esc(a.id) + '"><div class="antrag-kopf"><div class="ava" style="background:' + farbe(a.name) + '">' + esc(initialen(a.name)) + "</div><div><b>" + esc(a.name) + "</b><small>beantragt am " + esc(a.eingang.slice(0, 10)) + '</small></div><span class="pill w a-tage">' + tageTxt(a.tage) + "</span></div>" +
        '<div class="antrag-zr">' + kurz(a.von) + " – " + kurz(a.bis) + "</div>" + (a.notiz ? '<div class="notiz">„' + esc(a.notiz) + "“</div>" : "") +
        '<div class="antrag-info">' + (rest == null ? "Urlaubsanspruch nicht hinterlegt (Reiter Mitarbeiter → Urlaub)." : "Resturlaub " + esc(k.jahr) + ": <b>" + zahlText(rest) + " Tage</b> → nach Genehmigung " + zahlText(rest - a.tage) + " Tage") + "</div>" +
        (konf.length ? '<div class="antrag-konf">Es fehlen schon: ' + konf.slice(0, 5).join(" · ") + (konf.length > 5 ? " · +" + (konf.length - 5) + " weitere Tage" : "") + "</div>" : '<div class="antrag-info" style="color:var(--gruen)">An diesen Tagen fehlt sonst niemand.</div>') +
        '<div class="korr-zeile"><label>Von<input type="date" class="a-von" value="' + esc(a.von) + '" /></label><label>Bis<input type="date" class="a-bis" value="' + esc(a.bis) + '" /></label>' +
        '<label class="grund">Antwort an den Mitarbeiter <span style="font-weight:500">(optional)</span><input type="text" class="a-antwort" placeholder="z. B. Bitte nur bis Mittwoch" /></label></div>' +
        '<div class="korr-knoepfe"><button type="button" class="speichern a-ok">Genehmigen</button><button type="button" class="aufheben a-nein">Ablehnen</button></div></div>';
    }
    function antragBinden(karte) {
      const a = (daten.antraege || []).find((x) => x.id === karte.dataset.id), $k = (c) => karte.querySelector(c);
      const zaehle = () => { const v = $k(".a-von").value, b = $k(".a-bis").value, n = v && b && b >= v ? tageZwischen(v, b).filter(werktag).length : 0; $k(".a-tage").textContent = n + (n === 1 ? " Tag" : " Tage"); $k(".a-ok").textContent = v === a.von && b === a.bis ? "Genehmigen" : "Mit neuem Zeitraum genehmigen"; };
      [".a-von", ".a-bis"].forEach((c) => $k(c).addEventListener("input", zaehle));
      $k(".a-ok").addEventListener("click", () => {
        const v = $k(".a-von").value, b = $k(".a-bis").value;
        if (!v || !b || b < v) { toast("Bitte einen gültigen Zeitraum angeben.", true); return; }
        aktionSenden({ aktion: "antrag", op: "genehmigen", pin: speicherS("az_dispo_pin"), id: a.id, von: v, bis: b, antwort: $k(".a-antwort").value.trim() },
          (r) => "Urlaub genehmigt: " + a.name + ", " + kurz(r.von) + " – " + kurz(r.bis) + " (" + r.tage + " Tage" + (r.stunden !== "" ? ", " + std(r.stunden) + " Std." : ", Stunden bitte eintragen") + ")");
      });
      $k(".a-nein").addEventListener("click", () => {
        const b = $k(".a-nein");
        if (!b.classList.contains("sicher")) { b.classList.add("sicher"); b.textContent = "Wirklich ablehnen?"; setTimeout(() => { if (b.isConnected) { b.classList.remove("sicher"); b.textContent = "Ablehnen"; } }, 6000); return; }
        aktionSenden({ aktion: "antrag", op: "ablehnen", pin: speicherS("az_dispo_pin"), id: a.id, antwort: $k(".a-antwort").value.trim() }, () => "Antrag von " + a.name + " abgelehnt");
      });
    }
    function monatsplan() {
      const tage = tageZwischen(monat + "-01", isoVon(new Date(+monat.slice(0, 4), +monat.slice(5, 7), 0))), erster = tage[0], letzter = tage[tage.length - 1], jahr = monat.slice(0, 4);
      const pro = new Map();
      const add = (name, art, von, bis) => {
        const k = norm(name); if (!pro.has(k)) pro.set(k, { name: name, tage: {} });
        tageZwischen(von < erster ? erster : von, bis > letzter ? letzter : bis).forEach((t) => { if (werktag(t) && (!pro.get(k).tage[t] || pro.get(k).tage[t] === "beantragt")) pro.get(k).tage[t] = art; });
      };
      daten.eintraege.filter((e) => e.art !== "arbeit" && !(e.von > letzter || e.bis < erster)).forEach((e) => add(e.name, e.art, e.von, e.bis));
      (daten.antraege || []).filter((a) => a.status === "beantragt" && !(a.von > letzter || a.bis < erster)).forEach((a) => add(a.name, "beantragt", a.von, a.bis));
      const team = (daten.mitarbeiterAlle || []).filter((m) => m.aktiv);
      const zeilen = (planAlle ? team.map((m) => pro.get(norm(m.name)) || { name: m.name, tage: {} }) : [...pro.values()]).sort((a, b) => a.name.localeCompare(b.name, "de"));
      if (!zeilen.length) return '<div class="uplan-box"><div class="leer">In diesem Monat ist niemand im Urlaub oder krank. Über „+ Urlaub eintragen“ kannst du Urlaub planen.</div></div>';
      const beantragtJahr = (n) => (daten.antraege || []).filter((a) => a.status === "beantragt" && norm(a.name) === n && a.von.slice(0, 4) === jahr).reduce((s2, a) => s2 + a.tage, 0);
      const rest = (name) => { const m = team.find((x) => norm(x.name) === norm(name)); if (!m || m.urlaubJahr == null) return null; return m.urlaubJahr + (m.uebertrag || 0) - ((daten.urlaubstage || {})[norm(name)] || 0) - beantragtJahr(norm(name)); };
      const spalten = "grid-template-columns: 150px repeat(" + tage.length + ", minmax(14px, 1fr)) 64px";
      let h = '<div class="uplan" style="' + spalten + '"><div></div>' + tage.map((t) => '<div class="kopfz">' + alsDatum(t).getDate() + "<br>" + alsDatum(t).toLocaleDateString("de-DE", { weekday: "narrow" }) + "</div>").join("") + '<div class="kopfz">Rest ' + jahr + "</div>";
      zeilen.forEach((z) => {
        const r2 = rest(z.name);
        const klick = backendAb("2.6") && team.some((m) => norm(m.name) === norm(z.name));
        h += '<div class="n" data-n="' + esc(z.name) + '">' + esc(z.name) + "</div>" + tage.map((t) => !werktag(t) ? '<div class="z we" title="' + esc(kurz(t) + (feiertag(t) ? " · " + feiertag(t) : "")) + '"></div>' :
          '<div class="z' + (z.tage[t] ? " " + z.tage[t] : "") + (klick ? " klick" : "") + '"' + (klick ? ' data-pn="' + esc(z.name) + '" data-pt="' + t + '" data-art="' + (z.tage[t] || "") + '"' : "") +
          ' title="' + esc(kurz(t) + (z.tage[t] ? " · " + (z.tage[t] === "beantragt" ? "Antrag offen" : z.tage[t] + " – klicken: Stunden an diesem Tag") : klick ? " · klicken: Urlaub eintragen" : "")) + '"></div>').join("") +
          '<div class="rest' + (r2 != null && r2 < 0 ? " minus" : "") + '">' + (r2 == null ? "–" : zahlText(r2)) + "</div>";
      });
      h += '<div class="n" style="cursor:default;color:var(--leise)">Es fehlen</div>' + tage.map((t) => {
        if (!werktag(t)) return "<div></div>";
        const n = [...pro.values()].filter((z) => z.tage[t] === "urlaub" || z.tage[t] === "krank").length;
        return '<div class="fehlt' + (n >= WARN_AB ? " viel" : "") + '">' + (n || "") + "</div>";
      }).join("") + "<div></div></div>";
      return '<div class="uplan-box">' + h + '<div style="font-size:.72rem;color:var(--leise);margin-top:.5rem"><span class="kc u" style="display:inline-block;width:auto">Urlaub</span> <span class="kc k" style="display:inline-block;width:auto">Krank</span> <span class="kc b" style="display:inline-block;width:auto">Antrag offen</span> · Rest = Anspruch + Übertrag − genommen − beantragt (Werktage ohne Feiertage)</div></div>';
    }

    // Monat direkt wählen (Urlaubsplanung, z. B. Sommerferien): 12 Monate zurück bis 12 Monate voraus
    function monatsOptionen() {
      const h = daten.heute.slice(0, 7);
      let o = "";
      for (let n = -12; n <= 12; n++) { const m = monatPlus(h, n); o += '<option value="' + m + '"' + (m === monat ? " selected" : "") + ">" + esc(monatText(m)) + "</option>"; }
      return o;
    }
    async function monatWahl(m) {
      const alt = monat; monat = m;
      const r = await lade(speicherS("az_dispo_pin"));
      if (r.status !== "ok") { monat = alt; if (r.status === "pin" || r.status === "gesperrt") $("abmelden").click(); else toast(r.message || "Fehler beim Laden.", true); zeichne(); }
    }
    // Urlaub/Krank für einen Mitarbeiter eintragen (wenn er es nicht selbst beantragt), Urlaub bekommt die Ø-Stunden
    function planEintragen(knopf, vor) {
      const team = (daten.mitarbeiterAlle || []).filter((m) => m.aktiv);
      const f = formularOeffnen(knopf, '<div class="korr-kopf">Urlaub oder Krank für einen Mitarbeiter eintragen, z. B. Sommerferien, wenn er es nicht selbst in der App beantragt. Urlaub bekommt gleich die Stunden aus dem Durchschnitt und steht beim Mitarbeiter als genehmigt.</div>' +
        '<div class="korr-zeile fahrzeug-zeile"><label>Mitarbeiter<select class="p-wer"><option value="">– bitte wählen –</option>' + team.map((m) => '<option value="' + esc(m.name) + '"' + (m.name === vor.name ? " selected" : "") + ">" + esc(m.name) + "</option>").join("") + "</select></label>" +
        '<label>Art<select class="p-art"><option value="urlaub">Urlaub</option><option value="krank">Krank</option></select></label></div>' +
        '<div class="korr-zeile" style="margin-top:.5rem;grid-template-columns:165px 165px minmax(0,1fr)"><label>Von<input type="date" class="p-von" value="' + esc(vor.tag || "") + '" /></label><label>Bis<input type="date" class="p-bis" value="' + esc(vor.tag || "") + '" /></label>' +
        '<label class="grund">Grund <span style="font-weight:500">(optional)</span><input type="text" class="p-g" placeholder="z. B. Sommerferien" /></label></div>' +
        '<div class="korr-vorschau"></div><div class="korr-knoepfe"><button type="button" class="speichern">Eintragen</button><button type="button" class="neben">Abbrechen</button></div>');
      const $f = (c) => f.querySelector(c), vs = $f(".korr-vorschau");
      const vorschau = () => { const v = $f(".p-von").value, b = $f(".p-bis").value; if (v && b && b < v) $f(".p-bis").value = v;
        const n = v ? tageZwischen(v, $f(".p-bis").value || v).filter(werktag).length : 0; vs.textContent = v ? n + (n === 1 ? " Werktag" : " Werktage") + " (ohne Wochenende und Feiertage)" : ""; };
      f.querySelectorAll("input").forEach((i) => i.addEventListener("input", vorschau)); vorschau();
      $f(".speichern").addEventListener("click", async () => {
        const name = $f(".p-wer").value, v = $f(".p-von").value, b = $f(".p-bis").value || v;
        if (!name) { toast("Bitte einen Mitarbeiter wählen.", true); $f(".p-wer").focus(); return; }
        if (!v) { toast("Bitte Von und Bis angeben.", true); $f(".p-von").focus(); return; }
        $("laden").hidden = false;
        let r;
        try { r = await apiPost({ aktion: "nachtragen", pin: speicherS("az_dispo_pin"), name: name, typ: $f(".p-art").value, von: v, bis: b, grund: $f(".p-g").value.trim() || "Urlaubsplanung" }); }
        catch (err) { r = { status: "error", message: "Keine Verbindung – nichts gespeichert." }; }
        $("laden").hidden = true;
        if (r.status === "ok") { toast(($f(".p-art").value === "urlaub" ? "Urlaub" : "Krank") + " eingetragen: " + name + ", " + kurz(v) + " – " + kurz(b) + " (" + r.tage + " Tage" + (r.netto ? ", " + std(r.netto) + " Std." : "") + ")"); await lade(speicherS("az_dispo_pin")); }
        else if (r.status === "pin" || r.status === "gesperrt") { toast(r.message, true); $("abmelden").click(); }
        else toast(r.status === "doppelt" ? r.message || "Für diesen Zeitraum ist schon etwas eingetragen." : r.message || "Fehler.", true);
      });
      (vor.name ? $f(".p-von") : $f(".p-wer")).focus();
    }

    // Urlaub/Krank verschieben: Stunden je Tag bleiben, die Summe passt sich den neuen Tagen an
    function zeitraumFormular(knopf, x) {
      const q = x.quelle, art = x.art === "krank" ? "Krank" : "Urlaub";
      const f = formularOeffnen(knopf, '<div class="korr-kopf">' + art + " <b>" + kurz(q.von) + " – " + kurz(q.bis) + "</b> verschieben oder verlängern:</div>" +
        '<div class="korr-zeile"><label>Von<input type="date" class="k-von" value="' + esc(q.von) + '" /></label><label>Bis<input type="date" class="k-bis" value="' + esc(q.bis) + '" /></label>' +
        '<label class="grund">Grund <span style="font-weight:500">(optional)</span><input type="text" class="k-g" placeholder="z. B. Mitarbeiter kommt früher zurück" /></label></div>' +
        '<div class="korr-vorschau"></div><div class="korr-knoepfe"><button type="button" class="speichern">Zeitraum speichern</button><button type="button" class="neben">Abbrechen</button></div>');
      const von = f.querySelector(".k-von"), bis = f.querySelector(".k-bis"), vs = f.querySelector(".korr-vorschau"), sp = f.querySelector(".speichern");
      const alt = tageZwischen(q.von, q.bis).filter(werktag).length;
      function vorschau() {
        if (!von.value || !bis.value || bis.value < von.value) { vs.innerHTML = '<span class="warn">Bitte einen gültigen Zeitraum angeben.</span>'; sp.disabled = true; return; }
        const n = tageZwischen(von.value, bis.value).filter(werktag).length;
        vs.innerHTML = n + (n === 1 ? " Werktag" : " Werktage") + " (bisher " + alt + ")" + (x.stundenOffen ? "" : " → " + std(rund(q.netto / (alt || 1) * n)) + " Std. gesamt");
        sp.disabled = !n || (von.value === q.von && bis.value === q.bis);
      }
      [von, bis].forEach((i) => i.addEventListener("input", vorschau)); vorschau();
      sp.addEventListener("click", () => aktionSenden({ aktion: "zeitraum", pin: speicherS("az_dispo_pin"), zeile: q.zeile, name: q.name, von: q.von, neuVon: von.value, neuBis: bis.value, grund: f.querySelector(".k-g").value.trim() },
        (r) => art + " jetzt " + kurz(r.von) + " – " + kurz(r.bis) + " (" + r.tage + " Tage)"));
      von.focus();
    }

    // Stunden an einem einzelnen Urlaubs-/Krankheitstag: die anderen Tage bleiben, die Summe des Zeitraums rechnet das Backend neu
    function tagFormular(knopf, x) {
      const q = x.quelle, art = x.art === "krank" ? "Krank" : "Urlaub";
      const f = formularOeffnen(knopf, '<div class="korr-kopf">' + art + " am <b>" + kurz(x.tag) + "</b> (Zeitraum " + kurz(q.von) + " – " + kurz(q.bis) + "). Stunden an diesem Tag:</div>" +
        '<div class="ds-box"></div>' +
        '<div class="korr-zeile fahrzeug-zeile"><label>Stunden<input type="number" class="k-std" min="0" max="24" step="0.25" inputmode="decimal" value="' + (x.stundenOffen ? "" : rund(x.netto)) + '" /></label><div class="hinweis-klein">Die anderen Tage bleiben, wie sie sind.</div></div>' +
        '<div class="korr-knoepfe"><button type="button" class="speichern">Tag speichern</button><button type="button" class="neben">Abbrechen</button>' + (backendAb("2.7") ? '<button type="button" class="neben zr-wechsel">Zeitraum ändern</button>' : "") + "</div>");
      const inp = f.querySelector(".k-std"), box = f.querySelector(".ds-box");
      const zw = f.querySelector(".zr-wechsel"); if (zw) zw.addEventListener("click", () => zeitraumFormular(knopf, x));
      apiPost({ aktion: "durchschnitt", pin: speicherS("az_dispo_pin"), name: q.name, von: q.von, bis: q.bis, art: x.art }).then((r) => {
        if (!box.isConnected || r.status !== "ok" || !r.werktage) return;
        box.innerHTML = "Ø letzte 13 Wochen: <b>" + std(r.proTag) + " Std./Tag</b>" + (r.gedeckelt ? " (höchstens " + r.max + ")" : "") + '<button type="button" class="link-plus ds-nehmen">Übernehmen</button>';
        box.querySelector(".ds-nehmen").addEventListener("click", () => { inp.value = r.proTag; inp.focus(); });
      }).catch(() => {});
      f.querySelector(".speichern").addEventListener("click", () => {
        if (inp.value === "") { toast("Bitte Stunden eintragen (0 geht auch).", true); inp.focus(); return; }
        aktionSenden({ aktion: "abwesenheitstag", pin: speicherS("az_dispo_pin"), zeile: q.zeile, name: q.name, von: q.von, tag: x.tag, stunden: inp.value },
          (r) => art + " " + kurz(x.tag) + ": " + std(r.tage[x.tag]) + " Std. · Zeitraum gesamt " + std(r.stunden) + " Std.");
      });
      inp.focus(); inp.select();
    }

    // Eintrag nachtragen (Mitarbeiter hat vergessen einzutragen): Arbeitszeit, Urlaub oder Krank – mit denselben Prüfungen wie die App
    function nachtragenFormular(knopf, x) {
      const p = x.p, liste = daten.fahrzeugListe || daten.fahrzeuge.map((k) => ({ kennzeichen: k, name: "", kategorie: "" }));
      const gruppen = {};

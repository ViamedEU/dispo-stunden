      liste.forEach((fz) => { const g = fz.kategorie || "Weitere"; (gruppen[g] = gruppen[g] || []).push(fz); });
      const fzOptionen = '<option value="">Ohne Fahrzeug</option>' + Object.keys(gruppen).sort((a, b) => a === "Verliehen" ? 1 : b === "Verliehen" ? -1 : a.localeCompare(b)).map((g) =>
        '<optgroup label="' + esc(g) + '">' + gruppen[g].map((fz) => '<option value="' + esc(fz.kennzeichen) + '">' + esc(fz.kennzeichen + (fz.name ? " · " + fz.name : "")) + "</option>").join("") + "</optgroup>").join("");
      const f = formularOeffnen(knopf, '<div class="korr-kopf">Eintrag für <b>' + esc(p.name) + "</b> nachtragen:</div>" +
        '<div class="korr-zeile fahrzeug-zeile"><label>Art<select class="k-art"><option value="arbeitszeit">Arbeitszeit</option><option value="urlaub">Urlaub</option><option value="krank">Krank</option></select></label>' +
        '<label>Datum<input type="date" class="k-dat" value="' + esc(x.tag) + '" max="' + esc(daten.heute) + '" /></label></div>' +
        '<div class="korr-zeile n-arbeit" style="margin-top:.5rem"><label>Beginn<input type="time" class="k-von" /></label><label>Ende<input type="time" class="k-bis" /></label>' +
        '<label class="grund">Fahrzeug<select class="k-fz">' + fzOptionen + "</select></label></div>" +
        '<div class="korr-zeile fahrzeug-zeile n-abw" style="margin-top:.5rem" hidden><label>Bis<input type="date" class="k-ende" value="' + esc(x.tag) + '" /></label><div class="hinweis-klein">Stunden: Urlaub danach über „Gesamt ändern“ bzw. je Tag, Krank rechnet der Durchschnitt.</div></div>' +
        '<div class="korr-zeile einzeln" style="margin-top:.5rem"><label class="grund">Grund<input type="text" class="k-g" placeholder="z. B. vergessen einzutragen, laut DMRZ" /></label></div>' +
        '<div class="korr-vorschau"></div><div class="korr-knoepfe"><button type="button" class="speichern">Eintragen</button><button type="button" class="neben">Abbrechen</button></div>');
      const $f = (c) => f.querySelector(c), art = $f(".k-art"), vs = $f(".korr-vorschau");
      function anzeige() {
        const arbeit = art.value === "arbeitszeit";
        $f(".n-arbeit").hidden = !arbeit; $f(".n-abw").hidden = arbeit;
        if ($f(".k-ende").value < $f(".k-dat").value) $f(".k-ende").value = $f(".k-dat").value;
        const b = $f(".k-von").value, e = $f(".k-bis").value;
        vs.innerHTML = arbeit && b && e ? (minuten(e) > minuten(b) ? b + "–" + e + " → <b>" + std(nettoAus(b, e)) + " Std. netto</b>" : '<span class="warn">Das Ende muss nach dem Beginn liegen.</span>') : "";
      }
      f.querySelectorAll("input, select").forEach((i) => i.addEventListener("input", anzeige)); anzeige();
      async function senden(bestaetigt) {
        const arbeit = art.value === "arbeitszeit", g = $f(".k-g").value.trim();
        if (!g) { toast("Bitte einen Grund angeben.", true); $f(".k-g").focus(); return; }
        if (arbeit && (!$f(".k-von").value || !$f(".k-bis").value)) { toast("Bitte Beginn und Ende eintragen.", true); return; }
        const body = { aktion: "nachtragen", pin: speicherS("az_dispo_pin"), name: p.name, typ: art.value, grund: g, bestaetigt: !!bestaetigt,
                       datum: $f(".k-dat").value, beginn: $f(".k-von").value, ende: $f(".k-bis").value, fahrzeug: $f(".k-fz").value, von: $f(".k-dat").value, bis: $f(".k-ende").value };
        $("laden").hidden = false;
        let r;
        try { r = await apiPost(body); } catch (err) { r = { status: "error", message: "Keine Verbindung – nichts gespeichert." }; }
        $("laden").hidden = true;
        if (r.status === "rueckfrage") {
          const vorh = (r.vorhandene || []).map((v) => v.beginn + "–" + v.ende).join(", ");
          if (confirm("An diesem Tag ist schon eingetragen: " + vorh + ".\nDie neue Zeit überschneidet sich damit. Trotzdem eintragen?")) senden(true);
          return;
        }
        if (r.status === "ok") { toast("Nachgetragen: " + p.name + (arbeit ? ", " + kurz(body.datum) + " " + body.beginn + "–" + body.ende : ", " + (art.value === "urlaub" ? "Urlaub" : "Krank") + " ab " + kurz(body.von))); await lade(speicherS("az_dispo_pin")); }
        else if (r.status === "pin" || r.status === "gesperrt") { toast(r.message, true); $("abmelden").click(); }
        else toast(r.status === "doppelt" ? "Dieser Eintrag ist schon gespeichert." : r.message || "Fehler.", true);
      }
      $f(".speichern").addEventListener("click", () => senden(false));
      $f(".k-von").focus();
    }

    // Selbst eingetippter / falsch geschriebener Name, der nicht in der Liste steht: allen Einträgen den richtigen Listennamen geben
    function zuordnenFormular(knopf, x) {
      const p = x.p, alle = (daten.mitarbeiterAlle || daten.mitarbeiter.map((m) => ({ name: m.name, aktiv: true }))).filter((m) => m.aktiv);
      const f = formularOeffnen(knopf, '<div class="korr-kopf"><b>' + esc(p.name) + "</b> steht nicht in der Mitarbeiterliste. Wer ist das? Alle Einträge unter diesem Namen (auch frühere Monate) bekommen den gewählten Namen.</div>" +
        '<div class="korr-zeile fahrzeug-zeile"><label>Mitarbeiter<select class="k-wer"><option value="">– bitte wählen –</option>' + alle.map((m) => '<option value="' + esc(m.name) + '">' + esc(m.name) + "</option>").join("") + "</select></label></div>" +
        '<div class="korr-knoepfe"><button type="button" class="speichern" disabled>Zuordnen</button><button type="button" class="neben">Abbrechen</button></div>');
      const sel = f.querySelector(".k-wer"), sp = f.querySelector(".speichern");
      sel.addEventListener("change", () => { sp.disabled = !sel.value; });
      sp.addEventListener("click", () => mitarbeiterAktion("umbenennen", p.name, "", sel.value));
      sel.focus();
    }

    // Monat abschließen: ausbezahlte Stunden aus der DATEV-Lohnabrechnung, der Rest geht als Übertrag in den nächsten Monat
    function kontoFormular(knopf, x) {
      const p = x.p, k = p.konto || {}, akt = k.aktuell, vorher = k.vorher, ist = rund(p.summe), nName = monatName(monatPlus(monat, 1));
      const f = formularOeffnen(knopf, '<div class="korr-kopf"><b>' + esc(monatText(monat)) + "</b> abschließen: Wie viele Stunden wurden ausbezahlt (DATEV-Lohnabrechnung)? Der Rest geht in den " + esc(nName) + ".</div>" +
        '<div class="korr-zeile fahrzeug-zeile">' +
        (vorher ? "" : '<label>Übertrag Vormonat (Startwert)<input type="number" class="k-alt" step="0.25" inputmode="decimal" value="' + (akt ? akt.uebertragAlt : 0) + '" /></label>') +
        '<label>Ausbezahlt (Std.)<input type="number" class="k-aus" min="0" step="0.25" inputmode="decimal" value="' + (akt ? akt.ausbezahlt : "") + '" /></label>' +
        '<label class="grund">Bemerkung <span style="font-weight:500">(optional)</span><input type="text" class="k-g" placeholder="z. B. laut Lohnabrechnung" value="' + esc(akt ? akt.bemerkung : "") + '" /></label></div>' +
        '<div><button type="button" class="link-plus" data-s="alles">Alles ausbezahlt</button> &nbsp; <button type="button" class="link-plus" data-s="nichts">Alles übertragen</button></div>' +
        '<div class="korr-vorschau"></div><div class="korr-knoepfe"><button type="button" class="speichern">Abschluss speichern</button><button type="button" class="neben">Abbrechen</button>' +
        (akt ? '<button type="button" class="aufheben">Abschluss löschen</button>' : "") + "</div>");
      const altInp = f.querySelector(".k-alt"), aus = f.querySelector(".k-aus"), g = f.querySelector(".k-g"), vs = f.querySelector(".korr-vorschau"), sp = f.querySelector(".speichern");
      const alt = () => vorher ? vorher.uebertragNeu : Number(String(altInp.value).replace(",", ".")) || 0;
      function vorschau() {
        if (aus.value === "") { vs.innerHTML = '<span class="warn">Bitte die ausbezahlten Stunden eintragen (0, wenn alles übertragen wird).</span>'; sp.disabled = true; return; }
        const neu = rund(alt() + ist - Number(aus.value));
        vs.innerHTML = mitVorzeichen(alt()) + " + " + std(ist) + " − " + std(Number(aus.value)) + " = <b>Übertrag " + esc(nName) + ": " + mitVorzeichen(neu) + " Std.</b>" + (neu < 0 ? ' <span class="minus">(Minusstunden)</span>' : "");
        sp.disabled = false;
      }
      f.querySelectorAll("[data-s]").forEach((b) => b.addEventListener("click", () => { aus.value = b.dataset.s === "alles" ? Math.max(0, rund(alt() + ist)) : 0; vorschau(); }));
      [aus, altInp].filter(Boolean).forEach((i) => i.addEventListener("input", vorschau)); vorschau();
      const senden = (extra, okText) => aktionSenden(Object.assign({ aktion: "stundenkonto", pin: speicherS("az_dispo_pin"), name: p.name, monat: monat }, extra), okText);
      sp.addEventListener("click", () => senden({ stunden: ist, ausbezahlt: aus.value, uebertragAlt: altInp ? altInp.value : "", bemerkung: g.value.trim() },
        (r) => "Stundenkonto gespeichert: Übertrag " + mitVorzeichen(r.konto.aktuell.uebertragNeu) + " Std."));
      const weg = f.querySelector(".aufheben"); if (weg) weg.addEventListener("click", () => senden({ op: "loeschen" }, () => "Abschluss gelöscht"));
      aus.focus();
    }

    // ---------- Bedienung ----------
    $("pin-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const pin = $("pin").value.trim(); if (!pin) return;
      $("pin-knopf").disabled = true; $("pin-fehler").textContent = "";
      const r = await lade(pin);
      $("pin-knopf").disabled = false;
      if (r.status === "ok") { speicherS("az_dispo_pin", pin); $("pin-seite").hidden = true; $("app").hidden = false; }
      else { $("pin-fehler").textContent = r.message || "Fehler."; $("pin").select(); }
    });
    $("abmelden").addEventListener("click", () => { speicherS("az_dispo_pin", null); daten = null; $("pin").value = ""; $("app").hidden = true; $("pin-seite").hidden = false; $("pin").focus(); });
    async function blaettern(n) { monat = monatPlus(monat, n); const r = await lade(speicherS("az_dispo_pin")); if (r.status !== "ok") { monat = monatPlus(monat, -n); if (r.status === "pin" || r.status === "gesperrt") $("abmelden").click(); else alert(r.message || "Fehler beim Laden."); } }
    $("vor").addEventListener("click", () => blaettern(-1));
    $("nach").addEventListener("click", () => blaettern(1));

          const key = [x.name, x.datum, x.beginn, x.ende].join("|"), k = this.korr[key], fa = this.fzAend[key];
          if (k) { x.leerzeit = k.abzug; x.netto = Math.round((x.nettoGemeldet - k.abzug) * 100) / 100; x.korrektur = { abzugszeit: k.abzugszeit, grund: k.grund, abzug: k.abzug, am: "18.10.2026 (Demo)" }; }
          if (fa) { fa.alt = fa.alt === undefined ? x.fahrzeug : fa.alt; x.fahrzeugAlt = { alt: fa.alt, grund: fa.grund, am: "18.10.2026 (Demo)" }; x.fahrzeug = fa.neu; }
        });
        const team = this.teamListe();
        return { mitarbeiter: team.filter((x) => x.aktiv).map((x) => ({ name: x.name, standort: "EU" })), mitarbeiterAlle: team.slice().sort((a, c) => a.name.localeCompare(c.name, "de")), fahrzeuge: fz,
          fahrzeugListe: fz.map((k, i) => ({ kennzeichen: k, name: ["BTW 1", "BTW 8", "BUS 6", "LMW 4", "TSW 3", "BUS 9", "BTW 9"][i], kategorie: ["BTW", "BTW", "BUS", "LMW", "TSW", "BUS", "BTW"][i] })), eintraege: e, erledigt: this.erledigt.slice(), konto: this.kontoFuer(m), ...(nurEintraege ? {} : this.urlaubDaten(m, e, team)) };
      },
      // Urlaubsplanung (Demo): Kalenderfenster ab Montag der Woche von „heute“, Anträge mit Konflikten und Resturlaub
      urlaubDaten(m, e, team) {
        const kalVon = "2026-10-12", kalBis = "2026-11-01";
        const abw = this.daten("2026-10", true).eintraege.concat(this.daten("2026-11", true).eintraege).filter((x) => x.art !== "arbeit");
        const urlaubstage = {};
        const gesehen = new Set();
        abw.filter((x) => x.art === "urlaub").forEach((x) => { const k = norm(x.name) + x.von + x.bis; if (gesehen.has(k)) return; gesehen.add(k); urlaubstage[norm(x.name)] = (urlaubstage[norm(x.name)] || 0) + tageZwischen(x.von, x.bis).filter(werktag).length; });
        const antraege = this.antraege.map((a) => {
          if (a.status !== "beantragt") return Object.assign({}, a);
          const konflikte = tageZwischen(a.von, a.bis).filter(werktag).map((t) => {
            const namen = {};
            abw.forEach((x) => { if (x.von <= t && x.bis >= t && x.name !== a.name) namen[x.name] = x.art === "krank" ? "krank" : "Urlaub"; });
            this.antraege.forEach((b) => { if (b !== a && b.status === "beantragt" && b.von <= t && b.bis >= t && !namen[b.name]) namen[b.name] = "beantragt"; });
            return { tag: t, namen: Object.keys(namen).map((n) => ({ name: n, art: namen[n] })) };
          }).filter((k) => k.namen.length);
          const t = team.find((x) => x.name === a.name) || {}, jahr = a.von.slice(0, 4);
          const beantragt = this.antraege.filter((b) => b.status === "beantragt" && b.name === a.name && b.von.slice(0, 4) === jahr).reduce((s2, b) => s2 + b.tage, 0);
          return Object.assign({}, a, { konflikte, konto: { jahr, anspruch: t.urlaubJahr == null ? null : t.urlaubJahr + (t.uebertrag || 0), genommen: urlaubstage[norm(a.name)] || 0, beantragt } });
        });
        return { kalender: { von: kalVon, bis: kalBis, eintraege: abw.filter((x) => !(x.von > kalBis || x.bis < kalVon)) }, antraege, urlaubstage };
      }
    };
